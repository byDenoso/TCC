name: NEXO Scheduled Persistence Relay

on:
  push:
    branches:
      - 'nexo/dispatch-runtime'
    paths:
      - 'nexo_persist/requests/*.json'
  workflow_dispatch:   # replays every request missing from nexo-inbox

permissions:
  contents: write

concurrency:
  group: nexo-scheduled-persistence-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relay every request of this push (or all missing ones on manual run)
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: python3 nexo_persist/relay.py

      - name: Wake the Writer robot now
        # Without this the proposal waits for GitHub's throttled */5 schedule (measured p50 54 min, p90 3.4 h).
        # Needs repo secret PANTHEON_WAKE_TOKEN (fine-grained PAT: byDenoso/Pantheon, Actions read+write). Absent = skip.
        env:
          GH_TOKEN: ${{ secrets.PANTHEON_WAKE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then echo "PANTHEON_WAKE_TOKEN not set; robot will pick this up on its schedule"; exit 0; fi
          gh workflow run nexo-writer-robot.yml -R byDenoso/Pantheon --ref main && echo "writer robot dispatched"

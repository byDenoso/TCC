name: Reset PEER ACT20 singleton

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/reset-peer-act20.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: reset-peer-act20
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: peer-n31p-act-20chains-optimized.yml
      TARGET_REF: run-optimized-peer-act20-20260730
    steps:
      - name: Cancel every unfinished ACT20 copy
        shell: bash
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id')
          for id in $ids; do
            echo "Cancelling ACT20 run $id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
          done
          sleep 15
      - name: Dispatch exactly one optimized campaign
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            -f ref="${TARGET_REF}"
          echo "Dispatched one ACT20 campaign on ${TARGET_REF}."

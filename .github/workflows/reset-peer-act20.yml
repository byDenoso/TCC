name: Reset PEER ACT20 singleton

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/reset-peer-act20.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: reset-peer-act20
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: peer-n31p-act-20chains-optimized.yml
    steps:
      - name: Keep newest ACT20 run and cancel older unfinished copies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=100" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | sort_by(.created_at) | reverse | .[].id'
          )
          if [[ ${#ids[@]} -eq 0 ]]; then
            echo "No unfinished ACT20 run exists."
            exit 1
          fi
          keep="${ids[0]}"
          echo "Keeping newest ACT20 run ${keep}."
          for id in "${ids[@]:1}"; do
            echo "Cancelling superseded ACT20 run ${id}."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
          done
          printf '%s\n' "${keep}" > kept_run_id.txt
      - name: Publish singleton audit
        uses: actions/upload-artifact@v4
        with:
          name: peer-act20-singleton
          path: kept_run_id.txt
          if-no-files-found: error
          retention-days: 30

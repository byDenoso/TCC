name: Temporary ACT DR6 direct-H0 matched campaign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-act-h0-direct-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-act-h0-direct-20260729
  cancel-in-progress: false

env:
  SCIENCE_REF: act-dr6-peer-test-20260729
  SOURCE_RUN_ID: '30455821484'
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  ACT_COMMIT: 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENCE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - name: Verify eight matched configurations
        run: |
          python - <<'PY'
          from act_dr6_mcmc_20260729.h0_campaign import build
          for lane in ('A','B'):
              for model in ('M0','M1','M2','M3'):
                  x=build(model,lane,'/tmp/packages',f'/tmp/{lane}_{model}/chain',20)
                  assert x['params']['H0']['prior']=={'min':60.0,'max':80.0}
                  assert x['sampler']['mcmc']['Rminus1_stop']==0.01
          print('8/8 matched configurations passed')
          PY

  mcmc:
    needs: controls
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        lane: [A, B]
        model: [M0, M1, M2, M3]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENCE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py arviz \
            'cobaya==3.6.2' 'sacc>=0.12.0'
      - name: Recover byte-verified runtime and likelihood payload
        run: |
          set -euxo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name validated-act-cosmorec-runtime-gslfix --dir validated
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name official-likelihood-packages-v3 --dir payload
          (cd payload && sha256sum -c official-likelihood-packages-v3.tar.gz.sha256)
          tar -xzf payload/official-likelihood-packages-v3.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
      - name: Activate validated scalar-field CAMB
        run: |
          set -euxo pipefail
          WHEEL=$(find validated -type f -name 'camb-*.whl' | head -1)
          test -n "$WHEEL"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          CAMBLIB=$(python - <<'PY'
          from pathlib import Path
          import camb
          print(sorted(Path(camb.__file__).resolve().parent.glob('camblib*.so'))[0])
          PY
          )
          ldd "$CAMBLIB" | tee camb_ldd.txt
          ! grep -q 'not found' camb_ldd.txt
          grep -E 'libgsl|libgslcblas' camb_ldd.txt
      - name: Install frozen ACT likelihood
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
      - name: Generate configuration
        run: |
          ROOT="$GITHUB_WORKSPACE/campaign_${{ matrix.lane }}_${{ matrix.model }}"
          python act_dr6_mcmc_20260729/h0_campaign.py \
            --lane '${{ matrix.lane }}' --model '${{ matrix.model }}' \
            --packages-path "$COBAYA_PACKAGES_PATH" --root "$ROOT" --max-samples 4000
      - name: Exact MCMC segment one
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/campaign_${{ matrix.lane }}_${{ matrix.model }}"
          timeout --signal=TERM 145m mpirun --oversubscribe -np 4 \
            cobaya-run "$ROOT/configs/mcmc.yaml" \
            >"$ROOT/logs/segment1.stdout.log" 2>"$ROOT/logs/segment1.stderr.log"
          echo "$?" > "$ROOT/logs/segment1.exit_code"
          exit 0
      - name: Midpoint gate and resume config
        run: |
          ROOT="$GITHUB_WORKSPACE/campaign_${{ matrix.lane }}_${{ matrix.model }}"
          python act_dr6_mcmc_20260729/convergence_gate.py --root "$ROOT" --burn 0.30 \
            --params H0 ombh2 omch2 tau logA ns peer_fede Alens rdrag omegam sigma8 S8 A_act P_act A_planck || true
          python - "$ROOT/configs/mcmc.yaml" <<'PY'
          import sys,yaml
          p=sys.argv[1]; d=yaml.safe_load(open(p)); d['force']=False; d['resume']=True
          yaml.safe_dump(d,open(p,'w'),sort_keys=False)
          PY
      - name: Exact MCMC segment two when needed
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/campaign_${{ matrix.lane }}_${{ matrix.model }}"
          DONE=$(python - <<PY
          import json
          try: print(int(bool(json.load(open('$ROOT/convergence_gate.json'))['converged'])))
          except Exception: print(0)
          PY
          )
          if [ "$DONE" = 0 ]; then
            timeout --signal=TERM 140m mpirun --oversubscribe -np 4 \
              cobaya-run -r "$ROOT/configs/mcmc.yaml" \
              >"$ROOT/logs/segment2.stdout.log" 2>"$ROOT/logs/segment2.stderr.log"
            echo "$?" > "$ROOT/logs/segment2.exit_code"
          fi
          exit 0
      - name: Final diagnostics
        if: always()
        run: |
          ROOT="$GITHUB_WORKSPACE/campaign_${{ matrix.lane }}_${{ matrix.model }}"
          python act_dr6_mcmc_20260729/convergence_gate.py --root "$ROOT" --burn 0.30 \
            --params H0 ombh2 omch2 tau logA ns peer_fede Alens rdrag omegam sigma8 S8 A_act P_act A_planck || true
          python act_dr6_mcmc_20260729/analyze_chains.py \
            --model '${{ matrix.model }}' --root "$ROOT" --burn 0.30 || true
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: act-h0-${{ matrix.lane }}-${{ matrix.model }}-20260729
          path: campaign_${{ matrix.lane }}_${{ matrix.model }}
          if-no-files-found: error
          retention-days: 30

  collect:
    if: always()
    needs: mcmc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: act-h0-*-20260729
          path: downloads
      - name: Collect relocatable diagnostics
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          rows=[]
          for gate in sorted(Path('downloads').rglob('convergence_gate.json')):
              d=json.load(open(gate)); root=gate.parent
              manifest=json.load(open(root/'manifest.json'))
              rows.append({'lane':manifest['lane'],'model':manifest['model'],
                           'converged':d['converged'],'n_chains':d['n_chains_read'],
                           'rhat_minus1_max':d['rhat_minus1_max'],
                           'ess_bulk_min':d['ess_bulk_min'],'ess_tail_min':d['ess_tail_min']})
          Path('matched_status.json').write_text(json.dumps(rows,indent=2))
          with open('matched_status.csv','w',newline='') as f:
              fields=list(rows[0]) if rows else ['lane']; w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: act-h0-matched-status-20260729
          path: |
            matched_status.json
            matched_status.csv
          retention-days: 30

name: Cancel stale PEER nested runs

on:
  push:
    branches: [run-peer-nested-20260910]
    paths:
      - '.github/workflows/cancel-duplicate-peer-nested.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stale nested runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          for RUN in 34524565527 34524569103; do
            gh run cancel "$RUN" --repo "$GITHUB_REPOSITORY" || true
          done
          sleep 5
          for RUN in 34524565527 34524569103; do
            gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url || true
          done

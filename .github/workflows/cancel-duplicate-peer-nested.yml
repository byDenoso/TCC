name: Cancel duplicate PEER nested run

on:
  push:
    branches: [run-peer-nested-20260910]
    paths:
      - '.github/workflows/cancel-duplicate-peer-nested.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-duplicate:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel duplicate PR-triggered nested run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh run cancel 34524569103 --repo "$GITHUB_REPOSITORY" || true
          sleep 3
          gh run view 34524569103 --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url

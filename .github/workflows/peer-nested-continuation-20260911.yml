name: PEER nested production continuation

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Frozen campaign identifier
        required: true
        type: string
      model:
        description: Model lane
        required: true
        type: choice
        options: [M1, M3]
      segment:
        description: Child segment ordinal (bootstrap is 0)
        required: true
        type: string
      parent_run_id:
        description: GitHub Actions run containing the canonical parent checkpoint artifact
        required: true
        type: string
      parent_artifact_name:
        description: Exact parent checkpoint artifact name
        required: true
        type: string
      expected_parent_digest:
        description: SHA256 checkpoint identity from the parent manifest
        required: true
        type: string
      runtime_source_run:
        description: Validated runtime artifact source run
        required: true
        default: '34561868964'
        type: string

permissions:
  contents: read
  actions: read

env:
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

concurrency:
  group: peer-nested-${{ inputs.campaign_id }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  continuation:
    name: ${{ inputs.campaign_id }}-${{ inputs.model }}-segment-${{ inputs.segment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production orchestration
        uses: actions/checkout@v4

      - name: Checkout frozen science stack
        uses: actions/checkout@v4
        with:
          ref: act-dr6-peer-test-20260729
          path: science-act

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install execution dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gfortran libgsl-dev openmpi-bin libopenmpi-dev git
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py 'cobaya==3.6.2' 'sacc>=0.12.0'
          cobaya-install polychord --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars --no-set-global

      - name: Materialize and verify frozen runtime
        run: |
          set -euxo pipefail
          python -m peer_decisive_followups.materialize_runtime \
            --source-run '${{ inputs.runtime_source_run }}' \
            --work "$GITHUB_WORKSPACE/runtime-work" \
            --packages "$COBAYA_PACKAGES_PATH" \
            --manifest "$GITHUB_WORKSPACE/runtime_manifest.json"
          cat "$GITHUB_WORKSPACE/runtime_manifest.json"

      - name: Download exactly one canonical parent checkpoint
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/parent_bundle"
          mkdir -p "$GITHUB_WORKSPACE/parent_bundle"
          gh run download '${{ inputs.parent_run_id }}' \
            --repo byDenoso/TCC \
            --name '${{ inputs.parent_artifact_name }}' \
            --dir "$GITHUB_WORKSPACE/parent_bundle"
          test -f "$GITHUB_WORKSPACE/parent_bundle/checkpoint_manifest.json"
          find "$GITHUB_WORKSPACE/parent_bundle" -maxdepth 2 -type f -print | sort

      - name: Full matched-stack preflight
        run: |
          set -euxo pipefail
          MODEL='${{ inputs.model }}'
          SEED=2026076101
          [ "$MODEL" = M3 ] && SEED=2026076103
          python -m peer_decisive_followups.production_config \
            --science "$GITHUB_WORKSPACE/science-act" \
            --model "$MODEL" \
            --packages "$COBAYA_PACKAGES_PATH" \
            --root "$GITHUB_WORKSPACE/preflight_${MODEL}" \
            --seed "$SEED"
          cobaya-run "$GITHUB_WORKSPACE/preflight_${MODEL}/data.yaml" --test

      - name: Restore, resume for 5h20, stop, and promote child checkpoint
        run: |
          set -euxo pipefail
          MODEL='${{ inputs.model }}'
          SEED=2026076101
          [ "$MODEL" = M3 ] && SEED=2026076103
          rm -rf "$GITHUB_WORKSPACE/child_bundle" "$GITHUB_WORKSPACE/evidence_${MODEL}"
          python -m peer_decisive_followups.orchestrate_segment \
            --model "$MODEL" \
            --science "$GITHUB_WORKSPACE/science-act" \
            --packages "$COBAYA_PACKAGES_PATH" \
            --work "$GITHUB_WORKSPACE/evidence_${MODEL}" \
            --runtime-manifest "$GITHUB_WORKSPACE/runtime_manifest.json" \
            --parent-bundle "$GITHUB_WORKSPACE/parent_bundle" \
            --expected-parent-digest '${{ inputs.expected_parent_digest }}' \
            --output-bundle "$GITHUB_WORKSPACE/child_bundle" \
            --segment '${{ inputs.segment }}' \
            --seed "$SEED" \
            --seconds 19200 \
            --grace-seconds 45

      - name: Verify promoted child checkpoint
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from peer_decisive_followups.checkpoint_manager import verify_bundle
          bundle = Path('child_bundle')
          manifest = json.loads((bundle / 'checkpoint_manifest.json').read_text())
          verified = verify_bundle(bundle, {
              'model': '${{ inputs.model }}',
              'parent_digest': '${{ inputs.expected_parent_digest }}',
              'checkpoint_digest': manifest['checkpoint_digest'],
          })
          print(json.dumps(verified, indent=2, sort_keys=True))
          PY

      - name: Upload compact canonical child checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: peer-nested-${{ inputs.campaign_id }}-${{ inputs.model }}-segment-${{ inputs.segment }}
          path: child_bundle
          retention-days: 30
          if-no-files-found: error

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: peer-nested-${{ inputs.campaign_id }}-${{ inputs.model }}-segment-${{ inputs.segment }}-FAILED-diagnostics
          path: |
            evidence_${{ inputs.model }}/nested_${{ inputs.model }}/segment_status.json
            evidence_${{ inputs.model }}/nested_${{ inputs.model }}/data/stdout.segment.log
            evidence_${{ inputs.model }}/nested_${{ inputs.model }}/data/stderr.segment.log
          retention-days: 7
          if-no-files-found: ignore

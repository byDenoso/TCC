name: NEXO Runtime Tests

on:
  push:
    paths:
      - 'runtime/nexo_execution/**'
      - 'runtime/nexo_core/**'
      - 'runtime/nexo_agent_api/**'
      - 'benchmarks/**'
      - '.github/workflows/nexo-execution-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run NEXO runtime unit tests
        run: |
          python -m unittest runtime.nexo_execution.test_execution -v
          python -m unittest runtime.nexo_execution.test_gz01_multprobe -v
          python -m unittest runtime.nexo_agent_api.test_service -v
          python -m unittest runtime.nexo_agent_api.test_handoff -v
          python -m unittest runtime.nexo_agent_api.test_executor_capability_gate -v
          python -m unittest runtime.nexo_agent_api.test_mutations -v
          python -m unittest runtime.nexo_agent_api.test_governance -v
          python -m unittest runtime.nexo_agent_api.test_legacy_routing -v
          python -m unittest runtime.nexo_agent_api.test_state_materialization -v
          python -m unittest runtime.nexo_agent_api.test_request_ingress -v
          python -m unittest discover -s runtime/nexo_core -p 'test_*.py' -v

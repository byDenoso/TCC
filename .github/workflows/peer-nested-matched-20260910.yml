name: PEER nested production bootstrap

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Frozen campaign identifier
        required: true
        type: string
      model:
        description: Model lane
        required: true
        type: choice
        options: [M1, M3]
      runtime_source_run:
        description: Validated runtime artifact source run
        required: true
        default: '34561868964'
        type: string

permissions:
  contents: read
  actions: read

env:
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

concurrency:
  group: peer-nested-bootstrap-${{ inputs.campaign_id }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: ${{ inputs.campaign_id }}-${{ inputs.model }}-bootstrap
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1440
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production orchestration
        uses: actions/checkout@v4

      - name: Checkout frozen science stack
        uses: actions/checkout@v4
        with:
          ref: act-dr6-peer-test-20260729
          path: science-act

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install execution dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gfortran libgsl-dev openmpi-bin libopenmpi-dev git
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py 'cobaya==3.6.2' 'sacc>=0.12.0'
          cobaya-install polychord --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars --no-set-global

      - name: Materialize and verify frozen runtime
        run: |
          set -euxo pipefail
          python -m peer_decisive_followups.materialize_runtime \
            --source-run '${{ inputs.runtime_source_run }}' \
            --work "$GITHUB_WORKSPACE/runtime-work" \
            --packages "$COBAYA_PACKAGES_PATH" \
            --manifest "$GITHUB_WORKSPACE/runtime_manifest.json"
          cat "$GITHUB_WORKSPACE/runtime_manifest.json"

      - name: Run unbounded bootstrap until stable PolyChord resume exists
        run: |
          set -euxo pipefail
          MODEL='${{ inputs.model }}'
          SEED=2026076101
          [ "$MODEL" = M3 ] && SEED=2026076103
          rm -rf "$GITHUB_WORKSPACE/bootstrap_bundle" "$GITHUB_WORKSPACE/evidence_${MODEL}"
          python -m peer_decisive_followups.bootstrap_production \
            --model "$MODEL" \
            --science "$GITHUB_WORKSPACE/science-act" \
            --packages "$COBAYA_PACKAGES_PATH" \
            --work "$GITHUB_WORKSPACE/evidence_${MODEL}" \
            --runtime-manifest "$GITHUB_WORKSPACE/runtime_manifest.json" \
            --output-bundle "$GITHUB_WORKSPACE/bootstrap_bundle" \
            --seed "$SEED" \
            --poll-seconds 30 \
            --grace-seconds 60

      - name: Verify promoted bootstrap checkpoint
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from peer_decisive_followups.checkpoint_manager import verify_bundle
          bundle = Path('bootstrap_bundle')
          manifest = json.loads((bundle / 'checkpoint_manifest.json').read_text())
          verified = verify_bundle(bundle, {
              'model': '${{ inputs.model }}',
              'parent_digest': None,
              'checkpoint_digest': manifest['checkpoint_digest'],
          })
          print(json.dumps(verified, indent=2, sort_keys=True))
          PY

      - name: Upload compact bootstrap checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: peer-nested-${{ inputs.campaign_id }}-${{ inputs.model }}-bootstrap
          path: bootstrap_bundle
          retention-days: 30
          if-no-files-found: error

      - name: Upload bootstrap failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: peer-nested-${{ inputs.campaign_id }}-${{ inputs.model }}-bootstrap-FAILED-diagnostics
          path: |
            evidence_${{ inputs.model }}/nested_${{ inputs.model }}/bootstrap_status.json
            evidence_${{ inputs.model }}/nested_${{ inputs.model }}/data/stdout.bootstrap.log
            evidence_${{ inputs.model }}/nested_${{ inputs.model }}/data/stderr.bootstrap.log
          retention-days: 7
          if-no-files-found: ignore

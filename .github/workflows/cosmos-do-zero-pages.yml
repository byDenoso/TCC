name: Cosmos do Zero | GitHub Pages

on:
  push:
    branches: [cosmos-do-zero]
    paths:
      - 'cosmos-do-zero/**'
      - '.github/workflows/cosmos-do-zero-pages.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Destino do build (o domínio requer DNS e Pages preparados)
        type: choice
        options: [github, custom]
        default: github
      publish:
        description: Publicar após todos os testes (substitui o site Pages de TCC)
        type: boolean
        default: false
      domain_ready:
        description: DNS e domínio do Pages conferidos para o destino selecionado
        type: boolean
        default: false

concurrency:
  group: cosmos-do-zero-pages
  cancel-in-progress: true

permissions: {}

env:
  SITE_URL: ${{ (inputs.target == 'custom' || contains(github.event.head_commit.message, '[publish-cosmos-custom]')) && 'https://cosmos.denerpereira.com.br' || 'https://bydenoso.github.io' }}
  SITE_BASE: ${{ (inputs.target == 'custom' || contains(github.event.head_commit.message, '[publish-cosmos-custom]')) && '/' || '/TCC/cosmos-do-zero' }}
  SITE_PUBLIC: 'true'

jobs:
  build:
    name: Analisar, testar e compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: cosmos-do-zero
    steps:
      - name: Exigir conferência antes de publicar
        if: inputs.publish && !inputs.domain_ready
        run: |
          echo 'Confirme DNS e Settings > Pages antes da publicação.'
          exit 1
      - name: Checkout da branch isolada
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node 24 + cache npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cosmos-do-zero/package-lock.json
      - name: Instalar exatamente o lockfile
        run: npm ci
      - name: Astro e TypeScript
        run: npm run check
      - name: Testes unitarios
        run: npm test
      - name: Testes HTTP
        run: npm run test:http
      - name: Compilar site publico
        run: npm run build
      - name: Validar links, recursos, canônicas, robots e sitemap
        run: npm run test:pages
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E e renders no preview com caminho base
        run: |
          export BASE_URL="http://127.0.0.1:4321${SITE_BASE%/}"
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/cosmos-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..40}; do
            if curl -fsS "$BASE_URL/" > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/cosmos-preview.log; exit 1; fi
          npm run test:e2e
          npm run test:renders
      - name: Empacotar destino selecionado
        run: node scripts/package-pages.mjs
      - name: Guardar artefato para inspeção (sem publicar)
        uses: actions/upload-artifact@v7
        with:
          name: cosmos-${{ inputs.target || 'github' }}-preview
          path: cosmos-do-zero/pages-root
          include-hidden-files: true
      - name: Conferir domínio configurado no Pages antes do deploy
        if: (inputs.publish && inputs.domain_ready) || (github.event_name == 'push' && github.ref == 'refs/heads/cosmos-do-zero' && (contains(github.event.head_commit.message, '[publish-cosmos-github]') || contains(github.event.head_commit.message, '[publish-cosmos-custom]')))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""')"
          expected=""
          if [ "$SITE_URL" = 'https://cosmos.denerpereira.com.br' ]; then
            expected='cosmos.denerpereira.com.br'
            node --input-type=module -e 'import {resolveCname} from "node:dns/promises"; import assert from "node:assert/strict"; const records=await resolveCname("cosmos.denerpereira.com.br"); assert.ok(records.some(x=>x.toLowerCase().replace(/\.$/, "") === "bydenoso.github.io"), "CNAME DNS inesperado");'
          fi
          test "$actual" = "$expected" || { echo 'Domínio de Settings > Pages difere do destino; deploy recusado.'; exit 1; }
      - name: Configurar Pages previamente habilitado
        if: (inputs.publish && inputs.domain_ready) || (github.event_name == 'push' && github.ref == 'refs/heads/cosmos-do-zero' && (contains(github.event.head_commit.message, '[publish-cosmos-github]') || contains(github.event.head_commit.message, '[publish-cosmos-custom]')))
        uses: actions/configure-pages@v6
      - name: Upload do artefato público
        if: (inputs.publish && inputs.domain_ready) || (github.event_name == 'push' && github.ref == 'refs/heads/cosmos-do-zero' && (contains(github.event.head_commit.message, '[publish-cosmos-github]') || contains(github.event.head_commit.message, '[publish-cosmos-custom]')))
        uses: actions/upload-pages-artifact@v5
        with:
          path: cosmos-do-zero/pages-root

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/cosmos-do-zero' && ((github.event_name == 'workflow_dispatch' && inputs.publish && inputs.domain_ready) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[publish-cosmos-github]') || contains(github.event.head_commit.message, '[publish-cosmos-custom]'))))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: cosmos-do-zero-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verificar site e capturar o publicado
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cosmos-do-zero
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cosmos-do-zero/package-lock.json
      - name: Dependencias do site e do Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Definir URL de verificação
        run: echo "BASE_URL=${SITE_URL}${SITE_BASE%/}" >> "$GITHUB_ENV"
      - name: URL publica e recursos
        run: |
          set -euo pipefail
          ready=0
          for i in {1..30}; do
            if curl -fLsS "$BASE_URL/" -o /tmp/cosmos-live.html && grep -q '<html' /tmp/cosmos-live.html; then ready=1; break; fi
            sleep 10
          done
          test "$ready" -eq 1
          curl -fLsS "$BASE_URL/robots.txt" | grep -F "Allow: ${SITE_BASE%/}/"
          curl -fLsS "$BASE_URL/sitemap.xml" | grep -F "$BASE_URL/"
          curl -fLsS "$BASE_URL/renders/hero-eclipse.webp" -o /tmp/cosmos-hero.webp
          test "$(wc -c < /tmp/cosmos-hero.webp)" -gt 1000
      - name: Jornada, escalas, interacoes, progresso e renders publicados
        run: |
          npm run test:e2e
          npm run test:renders
      - name: Capturas da URL real (desktop e mobile)
        run: node scripts/capture-public.mjs
      - name: Salvar capturas reais do Pages
        uses: actions/upload-artifact@v7
        with:
          name: cosmos-do-zero-publicado
          path: |
            cosmos-do-zero/docs/screenshots/publicado-desktop.png
            cosmos-do-zero/docs/screenshots/publicado-mobile.png
          retention-days: 30

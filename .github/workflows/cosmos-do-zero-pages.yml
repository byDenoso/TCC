name: Cosmos | Escola de Ciências

on:
  pull_request:
    branches: [cosmos-do-zero]
    paths: ['cosmos-do-zero/escola/**', '.github/workflows/cosmos-do-zero-pages.yml']
  push:
    branches: [cosmos-do-zero]
    paths: ['cosmos-do-zero/escola/**', '.github/workflows/cosmos-do-zero-pages.yml']
  workflow_dispatch:

permissions: {}
concurrency:
  group: cosmos-escola-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: cosmos-do-zero/escola
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cosmos_test
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: escola_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cosmos_test -d escola_test"
          --health-interval 5s --health-timeout 4s --health-retries 12
    env:
      COSMOS_TEST_DATABASE_URL: postgresql://cosmos_test:ci_local_only@127.0.0.1:5432/escola_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cosmos-do-zero/escola/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run check && npm test && npm run test:database
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Conferir contas e publicação editorial em PostgreSQL
        run: |
          export DATABASE_URL="$COSMOS_TEST_DATABASE_URL"
          node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 4173 > /tmp/cosmos-school-node.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          BASE_URL=http://127.0.0.1:4173 node tests/account.mjs
      - run: npm run build:pages
      - name: Exercitar a escola exportada
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/cosmos-school-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          export BASE_URL=http://127.0.0.1:4173
          npm run test:browser
          node tests/explorer.mjs
      - name: Conferir o domínio próprio
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/cosmos-do-zero'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .cname)" = "cosmos.denerpereira.com.br"
          touch out/.nojekyll
          echo cosmos.denerpereira.com.br > out/CNAME
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/cosmos-do-zero'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/cosmos-do-zero'
        with:
          path: cosmos-do-zero/escola/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/cosmos-do-zero'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: cosmos-do-zero-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - id: release
        uses: actions/deploy-pages@v5
      - name: Ler a escola no domínio público
        run: |
          for i in {1..30}; do
            if curl -fsSL https://cosmos.denerpereira.com.br/ | grep -F 'Consultar o programa' > /dev/null; then exit 0; fi
            sleep 5
          done
          exit 1

name: NEXO control-plane CI

on:
  pull_request:
    paths:
      - 'nexo_control_plane/**'
      - 'tests/**'
      - 'docs/superpowers/**'
      - '.github/workflows/nexo-control-plane-ci.yml'
  push:
    branches:
      - main
      - 'nexo/**'
    paths:
      - 'nexo_control_plane/**'
      - 'tests/**'
      - 'docs/superpowers/**'
      - '.github/workflows/nexo-control-plane-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-control-plane-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Compile
        run: python -m compileall -q nexo_control_plane tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Shadow smoke test
        run: python -m nexo_control_plane.cli shadow tests/fixtures/shadow_snapshot.json > /tmp/nexo-shadow-plan.json

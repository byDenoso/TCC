name: NEXO Mail Bridge Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nexo-mail-bridge-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body: 'NEXO-MAIL-BRIDGE-FRESH-TOKEN ' + context.sha
            })

name: NEXO Runtime Reconciler CI

on:
  pull_request:
    paths:
      - 'runtime/nexo_agent_api/**'
      - 'runtime/nexo_execution/**'
      - 'tests/**'
      - 'gpt/tasks/**'
      - 'gpt/skills/**'
      - 'gpt/PROPOSAL_SCHEMA.md'
      - 'gpt/nexo_memory.py'
      - 'gpt/nexo_gpt_writer.py'
      - 'scripts/build_gpt_writer_bundle.py'
      - 'scripts/build_nexo_memory_bundle.py'
      - '.github/workflows/nexo-runtime-reconciler-ci.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/nexo_agent_api/**'
      - 'runtime/nexo_execution/**'
      - 'tests/**'
      - 'gpt/tasks/**'
      - 'gpt/skills/**'
      - 'gpt/PROPOSAL_SCHEMA.md'
      - 'gpt/nexo_memory.py'
      - 'gpt/nexo_gpt_writer.py'
      - 'scripts/build_gpt_writer_bundle.py'
      - 'scripts/build_nexo_memory_bundle.py'
      - '.github/workflows/nexo-runtime-reconciler-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete runtime regression suite
        run: |
          python -m pip install pytest==9.1.1 numpy==2.3.5 scikit-learn==1.8.0
          PYTHONPATH="$PWD/tests:$PWD" python -m pytest tests runtime/nexo_agent_api runtime/nexo_execution -q
      - name: Rebuild ChatGPT Writer bundle from tested sources
        run: |
          set -euo pipefail
          python scripts/build_nexo_memory_bundle.py --check
          python scripts/build_gpt_writer_bundle.py
          python -m py_compile gpt/nexo_gpt_writer.py
          grep -q 'Bundle sha256:' gpt/nexo_gpt_writer.py
          git diff --exit-code -- gpt/nexo_memory.py gpt/nexo_gpt_writer.py

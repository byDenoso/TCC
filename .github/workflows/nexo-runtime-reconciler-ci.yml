name: NEXO Runtime Reconciler CI

on:
  pull_request:
    paths:
      - 'runtime/nexo_agent_api/**'
      - 'runtime/nexo_execution/**'
      - 'tests/**'
      - 'gpt/tasks/**'
      - 'runtime/nexo_agent_api/evolution.py'
      - 'runtime/nexo_agent_api/execution_recovery.py'
      - 'runtime/nexo_agent_api/handoff.py'
      - 'runtime/nexo_agent_api/test_handoff.py'
      - 'tests/test_execution_recovery.py'
      - 'gpt/skills/**'
      - 'gpt/PROPOSAL_SCHEMA.md'
      - 'runtime/nexo_agent_api/gpt_writer.py'
      - 'runtime/nexo_agent_api/scientific_integrity.py'
      - 'runtime/nexo_agent_api/inbox_apply.py'
      - 'runtime/nexo_agent_api/service.py'
      - 'runtime/nexo_agent_api/tower_apply.py'
      - 'gpt/nexo_memory.py'
      - 'gpt/nexo_gpt_writer.py'
      - 'tests/test_robot_persistence.py'
      - 'tests/test_scientific_integrity.py'
      - 'tests/test_writer_bundle.py'
      - 'scripts/build_gpt_writer_bundle.py'
      - 'scripts/build_nexo_memory_bundle.py'
      - 'scripts/build_public_projection.py'
      - 'scripts/nexo_tower.py'
      - 'runtime/nexo_agent_api/global_reconciler.py'
      - 'runtime/nexo_agent_api/scheduler_topology.py'
      - 'runtime/nexo_agent_api/test_global_reconciler.py'
      - 'runtime/nexo_agent_api/test_scheduler_topology.py'
      - '.github/workflows/nexo-runtime-reconciler-ci.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/nexo_agent_api/**'
      - 'runtime/nexo_execution/**'
      - 'tests/**'
      - 'gpt/tasks/**'
      - 'runtime/nexo_agent_api/evolution.py'
      - 'runtime/nexo_agent_api/execution_recovery.py'
      - 'runtime/nexo_agent_api/handoff.py'
      - 'runtime/nexo_agent_api/test_handoff.py'
      - 'tests/test_execution_recovery.py'
      - 'gpt/skills/**'
      - 'gpt/PROPOSAL_SCHEMA.md'
      - 'runtime/nexo_agent_api/gpt_writer.py'
      - 'runtime/nexo_agent_api/scientific_integrity.py'
      - 'runtime/nexo_agent_api/inbox_apply.py'
      - 'runtime/nexo_agent_api/service.py'
      - 'runtime/nexo_agent_api/tower_apply.py'
      - 'gpt/nexo_memory.py'
      - 'gpt/nexo_gpt_writer.py'
      - 'tests/test_robot_persistence.py'
      - 'tests/test_scientific_integrity.py'
      - 'tests/test_writer_bundle.py'
      - 'scripts/build_gpt_writer_bundle.py'
      - 'scripts/build_nexo_memory_bundle.py'
      - 'scripts/build_public_projection.py'
      - 'scripts/nexo_tower.py'
      - 'runtime/nexo_agent_api/global_reconciler.py'
      - 'runtime/nexo_agent_api/scheduler_topology.py'
      - 'runtime/nexo_agent_api/test_global_reconciler.py'
      - 'runtime/nexo_agent_api/test_scheduler_topology.py'
      - '.github/workflows/nexo-runtime-reconciler-ci.yml'

permissions:
  contents: read

concurrency:
  group: nexo-runtime-reconciler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete runtime regression suite
        run: |
          python -m pip install pytest==9.1.1 numpy==2.3.5 scikit-learn==1.8.0
          PYTHONPATH="$PWD/tests:$PWD" python -m pytest tests runtime/nexo_agent_api runtime/nexo_execution -q
      - name: Rebuild ChatGPT Writer bundle from tested sources
        run: |
          set -euo pipefail
          python scripts/build_nexo_memory_bundle.py --check
          python scripts/build_gpt_writer_bundle.py
          python -m py_compile gpt/nexo_gpt_writer.py
          grep -q 'Bundle sha256:' gpt/nexo_gpt_writer.py
          git diff --exit-code -- gpt/nexo_memory.py gpt/nexo_gpt_writer.py

name: ACT DR6 matched quartet MCMC

on:
  push:
    branches: [act-dr6-peer-test-20260729]
    paths:
      - 'act_dr6_mcmc_20260729/**'
      - '.github/workflows/act-dr6-matched-mcmc.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  ACT_COMMIT: 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
  DATA_CACHE_KEY: act-pact-desi-dr2-planck-20260729-v2
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compilers and MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make libgsl-dev openmpi-bin libopenmpi-dev wget
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml pytest getdist mpi4py \
            'camb==1.6.6' 'cobaya==3.6.2' 'sacc>=0.12.0'
      - name: Build CAMB 1.6.6 with CosmoRec
        run: |
          set -euxo pipefail
          wget -q https://www.cita.utoronto.ca/~jchluba/Recombination/_Downloads_/CosmoRec.v2.0.3b.tar.gz
          tar -xzf CosmoRec.v2.0.3b.tar.gz
          COSMO_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'CosmoRec*' | head -1)
          test -n "$COSMO_DIR"
          sed -i -E '/^CXXFLAGS[[:space:]]*=/ s/$/ -fPIC/' "$COSMO_DIR/Makefile.in"
          make -C "$COSMO_DIR" all -j2
          git clone --recursive --depth 1 --branch 1.6.6 https://github.com/cmbant/CAMB.git camb-src
          sed -i 's/^RECOMBINATION_FILES ?= recfast$/RECOMBINATION_FILES ?= recfast cosmorec/' camb-src/fortran/Makefile_main
          sed -i "s|^COSMOREC_PATH ?=.*|COSMOREC_PATH ?=$COSMO_DIR|" camb-src/fortran/Makefile_main
          cd camb-src
          python setup.py make
          mkdir -p ../wheelhouse
          python -m pip wheel . --no-deps -w ../wheelhouse
          cd ..
          mkdir -p camb-runtime
          cp wheelhouse/camb-*.whl camb-runtime/
          cp -a "$COSMO_DIR/Rec_database" camb-runtime/Rec_database
          sha256sum camb-runtime/camb-*.whl | tee camb_cosmorec_sha256.txt
          find camb-runtime/Rec_database -type f -print0 | sort -z | xargs -0 sha256sum \
            > cosmorec_database_sha256.txt
          cp camb_cosmorec_sha256.txt cosmorec_database_sha256.txt camb-runtime/
      - name: Upload CAMB CosmoRec runtime
        uses: actions/upload-artifact@v4
        with:
          name: camb-1.6.6-cosmorec-wheel
          path: camb-runtime
          retention-days: 30
      - name: Install official ACT DR6 lite likelihood
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
          git rev-parse HEAD | tee ../act_lite_commit.txt
      - name: Restore official likelihood data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: packages
          key: ${{ env.DATA_CACHE_KEY }}
      - name: Install official likelihood data
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install \
            act_dr6_cmbonly \
            act_dr6_cmbonly.PlanckActCut \
            planck_2018_lowl.TT \
            planck_2018_lowl.EE_sroll2 \
            planck_2018_lensing.native \
            bao.desi_dr2.desi_bao_all \
            --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars
      - name: Record payload checksums
        run: |
          find "$COBAYA_PACKAGES_PATH" -type f \( -name '*.fits' -o -name '*.dataset' -o -name '*.txt' -o -name '*.dat' \) -print0 \
            | sort -z | xargs -0 sha256sum > official_payload_sha256.txt
          find "$COBAYA_PACKAGES_PATH" -maxdepth 5 -type f -print | sort > installed_files.txt
      - name: Run ACT package regression tests with reference CAMB
        run: |
          pytest -v --pyargs act_dr6_cmbonly \
            -k 'test_import or test_install or test_model or test_TTTEEE or test_Planck' \
            | tee official_act_tests.log
      - name: Activate CAMB CosmoRec runtime
        run: |
          WHEEL=$(find camb-runtime -type f -name 'camb-*.whl' | head -1)
          DB=$(find camb-runtime -type d -name Rec_database | head -1)
          test -n "$WHEEL"
          test -n "$DB"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath "$DB")" "$GITHUB_WORKSPACE/Rec_database"
          python - <<'PY'
          import camb
          from camb import recombination
          print('CAMB', camb.__version__, 'CosmoRec', type(recombination.CosmoRec()).__name__)
          PY
          test -f "$GITHUB_WORKSPACE/Rec_database/Effective_Rates.HI/Effective_Rate_Tables.nS_3/res_state_list.dat"
      - name: Generate and smoke-test matched quartet
        run: |
          set -euxo pipefail
          for MODEL in M0 M1 M2 M3; do
            ROOT="$GITHUB_WORKSPACE/smoke_${MODEL}"
            python act_dr6_mcmc_20260729/campaign.py write-configs \
              --model "$MODEL" --packages "$COBAYA_PACKAGES_PATH" --root "$ROOT"
            cobaya-run "$ROOT/configs/mcmc.yaml" --test 2>&1 | tee "$ROOT/smoke.log"
          done
      - name: Package gates
        if: always()
        run: |
          mkdir -p gate_outputs
          cp -f act_lite_commit.txt official_payload_sha256.txt installed_files.txt \
            official_act_tests.log camb_cosmorec_sha256.txt cosmorec_database_sha256.txt gate_outputs/ || true
          cp -r smoke_M* gate_outputs/ || true
          tar -czf ACT_DR6_MATCHED_GATES_20260729.tar.gz gate_outputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: act-dr6-matched-gates-20260729
          path: |
            gate_outputs
            ACT_DR6_MATCHED_GATES_20260729.tar.gz
          retention-days: 30

  minimize:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: [M0, M1, M2, M3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MPI and Python runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py \
            'cobaya==3.6.2' 'sacc>=0.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: camb-1.6.6-cosmorec-wheel
          path: camb-runtime
      - name: Install CAMB CosmoRec and ACT likelihood
        run: |
          WHEEL=$(find camb-runtime -type f -name 'camb-*.whl' | head -1)
          DB=$(find camb-runtime -type d -name Rec_database | head -1)
          test -n "$WHEEL"
          test -n "$DB"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath "$DB")" "$GITHUB_WORKSPACE/Rec_database"
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: packages
          key: ${{ env.DATA_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Generate eight matched minimizations
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py write-configs \
            --model "$MODEL" --packages "$COBAYA_PACKAGES_PATH" --root "$ROOT"
      - name: Run eight independent starts
        shell: bash
        run: |
          set -uo pipefail
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          run_one() {
            I="$1"
            mkdir -p "$ROOT/logs"
            cobaya-run "$ROOT/configs/minimize_${I}.yaml" \
              >"$ROOT/logs/minimize_${I}.stdout.log" \
              2>"$ROOT/logs/minimize_${I}.stderr.log"
            echo "$?" > "$ROOT/logs/minimize_${I}.exit_code"
          }
          export -f run_one
          export ROOT
          seq 1 8 | xargs -n1 -P4 bash -c 'run_one "$@"' _
          python act_dr6_mcmc_20260729/campaign.py summarize --model "$MODEL" --root "$ROOT" || true
          test "$(find "$ROOT/minimize" -name 'chain.minimum.txt' | wc -l)" -ge 4
      - name: Upload minimizer outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-minima-${{ matrix.model }}-20260729
          path: campaign_${{ matrix.model }}
          retention-days: 30

  mcmc:
    needs: [prepare, minimize]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: [M0, M1, M2, M3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MPI and Python runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py \
            'cobaya==3.6.2' 'sacc>=0.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: camb-1.6.6-cosmorec-wheel
          path: camb-runtime
      - name: Install CAMB CosmoRec and ACT likelihood
        run: |
          WHEEL=$(find camb-runtime -type f -name 'camb-*.whl' | head -1)
          DB=$(find camb-runtime -type d -name Rec_database | head -1)
          test -n "$WHEEL"
          test -n "$DB"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath "$DB")" "$GITHUB_WORKSPACE/Rec_database"
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: packages
          key: ${{ env.DATA_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: act-minima-${{ matrix.model }}-20260729
          path: downloaded_minima
      - name: Rebuild portable config and promote best minimum
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py write-configs \
            --model "$MODEL" --packages "$COBAYA_PACKAGES_PATH" --root "$ROOT"
          SRC=$(find downloaded_minima -type d -name minimize | head -1)
          test -n "$SRC"
          rm -rf "$ROOT/minimize"
          cp -r "$SRC" "$ROOT/minimize"
          python act_dr6_mcmc_20260729/campaign.py promote-best --model "$MODEL" --root "$ROOT"
      - name: Run four-chain MPI MCMC
        shell: bash
        run: |
          set +e
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          mkdir -p "$ROOT/logs"
          timeout --signal=TERM 325m mpirun --oversubscribe -np 4 \
            cobaya-run "$ROOT/configs/mcmc.yaml" \
            >"$ROOT/logs/mcmc.stdout.log" 2>"$ROOT/logs/mcmc.stderr.log"
          CODE=$?
          echo "$CODE" | tee "$ROOT/mcmc_exit_code.txt"
          exit 0
      - name: Summarize posterior and convergence
        if: always()
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py summarize --model "$MODEL" --root "$ROOT" || true
          python act_dr6_mcmc_20260729/analyze_chains.py --model "$MODEL" --root "$ROOT" --burn 0.30 || true
          tar -czf "ACT_DR6_${MODEL}_MCMC_20260729.tar.gz" "campaign_${MODEL}"
      - name: Upload chain artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-dr6-${{ matrix.model }}-mcmc-20260729
          path: |
            campaign_${{ matrix.model }}
            ACT_DR6_${{ matrix.model }}_MCMC_20260729.tar.gz
          retention-days: 30

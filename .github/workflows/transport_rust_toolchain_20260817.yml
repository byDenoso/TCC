name: transport-rust-toolchain-20260817

on:
  push:
    branches:
      - toolchain/rust-1.85.1-transport-20260817
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy
      - name: Prime NOVA-RUST dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nova-rust-fetch/src
          cat >/tmp/nova-rust-fetch/Cargo.toml <<'EOF'
          [package]
          name = "nova-rust-fetch"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          anyhow = "1.0.97"
          clap = { version = "4.5.32", features = ["derive"] }
          hex = "0.4.3"
          indexmap = { version = "2.8.0", features = ["serde"] }
          lru = "0.13.0"
          parking_lot = "0.12.3"
          pyo3 = { version = "0.23.5", features = ["extension-module", "abi3-py311"] }
          proptest = "1.6.0"
          serde = { version = "1.0.219", features = ["derive"] }
          serde_json = "1.0.140"
          sha2 = "0.10.8"
          thiserror = "2.0.12"
          tempfile = "3.19.1"
          EOF
          printf 'fn main() {}\n' >/tmp/nova-rust-fetch/src/main.rs
          cd /tmp/nova-rust-fetch
          cargo fetch
      - name: Package toolchain and Cargo registry
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          mkdir -p transport/toolchain transport/cargo-home
          cp -a "$SYSROOT"/. transport/toolchain/
          cp -a "$HOME/.cargo/registry" transport/cargo-home/
          if [ -d "$HOME/.cargo/git" ]; then cp -a "$HOME/.cargo/git" transport/cargo-home/; fi
          rustc -Vv > transport/RUSTC_VERSION.txt
          cargo -V > transport/CARGO_VERSION.txt
          rustfmt -V > transport/RUSTFMT_VERSION.txt
          cargo clippy -V > transport/CLIPPY_VERSION.txt
          (cd transport && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf rust-toolchain-1.85.1-offline.tar.gz -C transport toolchain cargo-home RUSTC_VERSION.txt CARGO_VERSION.txt RUSTFMT_VERSION.txt CLIPPY_VERSION.txt SHA256SUMS.txt
          sha256sum rust-toolchain-1.85.1-offline.tar.gz > rust-toolchain-1.85.1-offline.tar.gz.sha256
          ls -lh rust-toolchain-1.85.1-offline.tar.gz*
      - uses: actions/upload-artifact@v4
        with:
          name: rust-toolchain-1.85.1-offline-20260817
          path: |
            rust-toolchain-1.85.1-offline.tar.gz
            rust-toolchain-1.85.1-offline.tar.gz.sha256
          retention-days: 1
          compression-level: 0

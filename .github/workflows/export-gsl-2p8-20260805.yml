name: Export frozen GSL 2.8 source

on:
  push:
    branches: [tooling/export-gsl-2p8-20260805]
    paths:
      - '.github/workflows/export-gsl-2p8-20260805.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify GSL 2.8
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            --output gsl-2.8.tar.gz \
            https://ftp.gnu.org/gnu/gsl/gsl-2.8.tar.gz
          echo '6f1dd6dffb3d2e2e9d7f3c5fb6cd96dd9c2796c68b0a3b3531a1eac09a5b7b2c  gsl-2.8.tar.gz' > EXPECTED_SHA256.txt
          ACTUAL=$(sha256sum gsl-2.8.tar.gz | awk '{print $1}')
          printf '%s  gsl-2.8.tar.gz\n' "$ACTUAL" > ACTUAL_SHA256.txt
          tar -tzf gsl-2.8.tar.gz >/dev/null
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('gsl-2.8.tar.gz')
          print({'size': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          PY
      - name: Upload frozen source
        uses: actions/upload-artifact@v4
        with:
          name: gsl-2.8-source-20260805
          path: |
            gsl-2.8.tar.gz
            ACTUAL_SHA256.txt
            EXPECTED_SHA256.txt
          if-no-files-found: error
          retention-days: 7

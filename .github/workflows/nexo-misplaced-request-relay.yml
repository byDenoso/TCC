name: NEXO misplaced request relay

# Agents sometimes write a persistence request to main (even under a folder named after the staging branch).
# Relay it to nexo-inbox exactly like the staging relay, so a wrong branch never loses a proposal.
on:
  push:
    branches: [main]
    paths:
      - '**/nexo_persist/requests/*.json'

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Evaluate exactly the commit that raised this event.
          ref: ${{ github.sha }}
      - name: Relay requests of this push
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: python3 -m nexo_persist._relay_shared
      - name: Wake the Writer robot now
        if: always()
        # Without this the proposal waits for GitHub's throttled */5 schedule.
        # Needs PANTHEON_WAKE_TOKEN (fine-grained PAT: Pantheon Actions read+write). Absent = skip.
        env:
          GH_TOKEN: ${{ secrets.PANTHEON_WAKE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then echo "PANTHEON_WAKE_TOKEN not set; robot will pick this up on its schedule"; exit 0; fi
          gh workflow run nexo-writer-robot.yml -R byDenoso/Pantheon --ref main && echo "writer robot dispatched"

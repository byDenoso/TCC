name: NEXO legacy Tower credential canary
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexo-legacy-tower-credential-canary.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install scoped Google client
        run: python -m pip install --quiet google-auth requests
      - name: Check legacy credential without logging secrets or file contents
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          raw = os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON', '')
          if not raw:
              raise SystemExit('CREDENTIAL_MISSING')
          info = json.loads(raw)
          if info.get('type') != 'service_account':
              raise SystemExit('CREDENTIAL_TYPE_UNSUPPORTED')
          credentials = service_account.Credentials.from_service_account_info(
              info, scopes=[
                  'https://www.googleapis.com/auth/spreadsheets',
                  'https://www.googleapis.com/auth/drive.readonly'])
          session = AuthorizedSession(credentials)
          response = session.get('https://www.googleapis.com/drive/v3/files',
                                 params={'pageSize': 1, 'fields': 'nextPageToken'},
                                 timeout=25)
          if response.status_code != 200:
              raise SystemExit('DRIVE_AUTH_FAILED_STATUS_' + str(response.status_code))
          print('LEGACY_TOWER_CREDENTIAL_VALID; DRIVE_LIST_SCOPE_OK; SCI_TEST_NEW=0')
          PY

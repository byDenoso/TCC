name: NEXO legacy Tower credential canary
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexo-legacy-tower-credential-canary.yml
      - scripts/nexo_legacy_tower_probe.py
      - scripts/tests/test_nexo_legacy_tower_probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audited code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install scoped Google client
        run: python -m pip install --quiet google-auth requests
      - name: Validate deterministic writes without credentials
        run: python -m unittest scripts.tests.test_nexo_legacy_tower_probe -v
      - name: Confirm Tower Sheets read/write through existing service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.NEXO_DRIVE_WRITER_JSON }}
        run: python -m scripts.nexo_legacy_tower_probe

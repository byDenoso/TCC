name: SPT D1 contract

on:
  push:
    branches: [peer-n31p-spt3g-d1-20260912]
    paths:
      - "peer_n31p_spt3g_20260729/**"
      - "act_dr6_mcmc_20260729/**"
      - ".github/workflows/spt-d1-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SPT_D1_REF: efe35b7bfd815a115d5123e210a6849a4175bc81

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install structural-test dependencies
        run: |
          python -m pip install -U pip numpy pandas pyyaml arviz pytest
      - name: Reproduce convergence gate non-finite diagnostic handling
        run: |
          python -m pytest -q act_dr6_mcmc_20260729/test_convergence_gate.py
      - name: Run campaign contract test
        run: |
          python -m peer_n31p_spt3g_20260729.test_campaign
      - name: Pin and install official SPT-3G D1 release surface
        run: |
          set -euxo pipefail
          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git spt-candl-data
          git -C spt-candl-data checkout "$SPT_D1_REF"
          test "$(git -C spt-candl-data rev-parse HEAD)" = "$SPT_D1_REF"
          python -m pip install 'candl-like==2.0.3'
          python -m pip install --no-deps ./spt-candl-data
          python - <<'PY'
          import importlib.metadata
          import spt_candl_data
          assert importlib.metadata.version('candl-like') == '2.0.3'
          assert spt_candl_data.__version__ == '3.0.0'
          assert spt_candl_data.SPT3G_D1_TnE.endswith('SPT3G_D1_TnE_index.yaml')
          print('Official SPT D1 package gate: PASS')
          PY
      - name: Generate config from the pinned upstream D1 template
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/spt-d1-config"
          TEMPLATE="$GITHUB_WORKSPACE/spt-candl-data/cobaya/SPT3G_D1_TnE/cobaya_ttteee.yaml"
          python -m peer_n31p_spt3g_20260729.campaign \
            --model N31P \
            --packages /tmp/packages \
            --root "$ROOT" \
            --spt-template "$TEMPLATE" \
            --spt-data-ref "$SPT_D1_REF"
          ROOT="$ROOT" python - <<'PY'
          import json, os, yaml
          from pathlib import Path
          root = Path(os.environ['ROOT'])
          info = yaml.safe_load((root / 'configs' / 'mcmc.yaml').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert info['likelihood']['candl_like']['class'] == 'candl.interface.CandlCobayaLikelihood'
          assert info['likelihood']['candl_like']['data_set_file'] == 'spt_candl_data.SPT3G_D1_TnE'
          assert 'Tcal_ext150' in info['params']
          assert info['params']['ombh2']['prior'] == {'min': 0.017, 'max': 0.027}
          assert manifest['spt_data_ref'] == os.environ['SPT_D1_REF']
          assert manifest['spt_dataset'] == 'SPT3G_D1_TnE'
          print('Pinned upstream template gate: PASS')
          PY

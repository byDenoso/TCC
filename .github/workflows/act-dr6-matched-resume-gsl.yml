name: ACT DR6 matched quartet resume with GSL

on:
  push:
    branches: [act-dr6-peer-test-20260729]
    paths:
      - '.github/workflows/act-dr6-matched-resume-gsl.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/act-dr6-matched-resume-gsl.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '30453797932'
  SOURCE_HEAD_SHA: 3feb2ad59ebde50a42ec83807fa381420d56730c
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  ACT_COMMIT: 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  gate-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source run and scientific tree
        shell: bash
        run: |
          set -euxo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source_run.json
          test "$(jq -r '.head_sha' source_run.json)" = "$SOURCE_HEAD_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" > source_jobs.json
          jq -e '[.jobs[] | select(.name == "reference" and .conclusion == "success")] | length == 1' source_jobs.json
          jq -e '[.jobs[] | select(.name == "prepare" and .conclusion == "success")] | length == 1' source_jobs.json
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git diff --exit-code "$SOURCE_HEAD_SHA" HEAD -- act_dr6_mcmc_20260729 \
            | tee scientific_diff.txt
      - name: Download validated runtime and gate artifacts
        shell: bash
        run: |
          set -euxo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name camb-1.6.6-cosmorec-wheel --dir source-runtime
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name act-dr6-matched-gates-20260729 --dir source-gates
          test -n "$(find source-runtime -type f -name 'camb-*.whl' -print -quit)"
          test -n "$(find source-runtime -type d -name Rec_database -print -quit)"
          test -n "$(find source-runtime -type d -name Development -print -quit)"
          test -n "$(find source-gates -type f -name official_payload_sha256.txt -print -quit)"
          find source-runtime -type f -print0 | sort -z | xargs -0 sha256sum \
            > reused_runtime_sha256.txt
      - name: Upload validated resume payload
        uses: actions/upload-artifact@v4
        with:
          name: validated-act-cosmorec-runtime-gslfix
          path: |
            source-runtime
            source-gates
            source_run.json
            source_jobs.json
            scientific_diff.txt
            reused_runtime_sha256.txt
          retention-days: 30

  data-runtime:
    needs: gate-reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install payload builder runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make libgsl-dev wget
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' 'camb==1.6.6' \
            'cobaya==3.6.2' 'sacc>=0.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: validated-act-cosmorec-runtime-gslfix
          path: validated
      - name: Install frozen ACT likelihood
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
      - name: Install official likelihood payload once
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install \
            act_dr6_cmbonly \
            act_dr6_cmbonly.PlanckActCut \
            planck_2018_lowl.TT \
            planck_2018_lowl.EE_sroll2 \
            planck_2018_lensing.native \
            bao.desi_dr2.desi_bao_all \
            --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
          find "$COBAYA_PACKAGES_PATH" -type f \( -name '*.fits' -o -name '*.dataset' -o -name '*.txt' -o -name '*.dat' \) -print0 \
            | sort -z | xargs -0 sha256sum > official_payload_sha256.txt
          find "$COBAYA_PACKAGES_PATH" -maxdepth 5 -type f -print | sort > installed_files.txt
      - name: Verify payload against validated source run
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_SUM=$(find validated/source-gates -type f -name official_payload_sha256.txt | head -1)
          test -n "$SOURCE_SUM"
          python - "$SOURCE_SUM" official_payload_sha256.txt <<'PY'
          import sys
          from pathlib import Path

          def load(path):
              out = {}
              for line in Path(path).read_text(encoding='utf-8', errors='replace').splitlines():
                  if not line.strip():
                      continue
                  digest, filename = line.split(maxsplit=1)
                  filename = filename.lstrip('*')
                  marker = '/packages/'
                  rel = filename.split(marker, 1)[1] if marker in filename else filename
                  out[rel] = digest
              return out

          source = load(sys.argv[1])
          current = load(sys.argv[2])
          missing = sorted(set(source) - set(current))
          extra = sorted(set(current) - set(source))
          changed = sorted(k for k in set(source) & set(current) if source[k] != current[k])
          report = [
              f'source_files={len(source)}',
              f'current_files={len(current)}',
              f'missing={len(missing)}',
              f'extra={len(extra)}',
              f'changed={len(changed)}',
          ]
          Path('payload_comparison.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          if missing or extra or changed:
              Path('payload_mismatch.json').write_text(
                  __import__('json').dumps({'missing': missing, 'extra': extra, 'changed': changed}, indent=2),
                  encoding='utf-8')
              raise SystemExit('Official payload differs from validated source run')
          PY
          cat payload_comparison.txt
      - name: Package byte-verified payload
        run: |
          set -euxo pipefail
          tar -czf official-likelihood-packages-v3.tar.gz packages
          sha256sum official-likelihood-packages-v3.tar.gz > official-likelihood-packages-v3.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: official-likelihood-packages-v3
          path: |
            official-likelihood-packages-v3.tar.gz
            official-likelihood-packages-v3.tar.gz.sha256
            official_payload_sha256.txt
            installed_files.txt
            payload_comparison.txt
            payload_mismatch.json
          if-no-files-found: warn
          retention-days: 30

  minimize:
    needs: [gate-reuse, data-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: [M0, M1, M2, M3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GSL, MPI and Python runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py \
            'cobaya==3.6.2' 'sacc>=0.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: validated-act-cosmorec-runtime-gslfix
          path: validated
      - uses: actions/download-artifact@v4
        with:
          name: official-likelihood-packages-v3
          path: payload
      - name: Activate byte-verified likelihood payload
        run: |
          set -euxo pipefail
          (cd payload && sha256sum -c official-likelihood-packages-v3.tar.gz.sha256)
          tar -xzf payload/official-likelihood-packages-v3.tar.gz -C "$GITHUB_WORKSPACE"
          test -d "$COBAYA_PACKAGES_PATH"
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
      - name: Activate validated CAMB CosmoRec runtime
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL=$(find validated/source-runtime -type f -name 'camb-*.whl' | head -1)
          DB=$(find validated/source-runtime -type d -name Rec_database | head -1)
          DEV=$(find validated/source-runtime -type d -name Development | head -1)
          test -n "$WHEEL"
          test -n "$DB"
          test -n "$DEV"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database" "$GITHUB_WORKSPACE/Development"
          ln -s "$(realpath "$DB")" "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath "$DEV")" "$GITHUB_WORKSPACE/Development"
          mkdir -p "$GITHUB_WORKSPACE/temp"
          python - <<'PY'
          import camb
          from camb import recombination
          print('CAMB', camb.__version__, camb.__file__, 'CosmoRec', type(recombination.CosmoRec()).__name__)
          PY
          CAMBLIB=$(python - <<'PY'
          from pathlib import Path
          import camb
          root = Path(camb.__file__).resolve().parent
          matches = sorted(root.glob('camblib*.so'))
          if not matches:
              raise SystemExit(f'camblib shared library not found under {root}')
          print(matches[0])
          PY
          )
          ldd "$CAMBLIB" | tee camb_ldd.txt
          ! grep -q 'not found' camb_ldd.txt
          grep -E 'libgsl|libgslcblas' camb_ldd.txt
      - name: Install frozen ACT likelihood
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
      - name: Generate eight matched minimizations
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py write-configs \
            --model "$MODEL" --packages "$COBAYA_PACKAGES_PATH" --root "$ROOT"
          python - <<PY
          import json
          from pathlib import Path
          root = Path(r"$ROOT")
          (root / "resume_provenance.json").write_text(json.dumps({
              "source_run_id": int("$SOURCE_RUN_ID"),
              "source_head_sha": "$SOURCE_HEAD_SHA",
              "current_head_sha": "${{ github.sha }}",
              "runtime_fix": "installed libgsl-dev; reused validated CAMB 1.6.6+CosmoRec runtime; byte-verified common likelihood payload; isolated CosmoRec workdirs",
              "model": "$MODEL"
          }, indent=2), encoding="utf-8")
          PY
      - name: Run eight independent starts
        shell: bash
        run: |
          set -uo pipefail
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          run_one() {
            I="$1"
            mkdir -p "$ROOT/logs"
            WORK="$ROOT/work/start_${I}"
            mkdir -p "$WORK/temp"
            ln -sfn "$GITHUB_WORKSPACE/Rec_database" "$WORK/Rec_database"
            ln -sfn "$GITHUB_WORKSPACE/Development" "$WORK/Development"
            set +e
            (
              cd "$WORK"
              cobaya-run "$ROOT/configs/minimize_${I}.yaml"
            ) >"$ROOT/logs/minimize_${I}.stdout.log" \
              2>"$ROOT/logs/minimize_${I}.stderr.log"
            CODE=$?
            printf '%s\n' "$CODE" > "$ROOT/logs/minimize_${I}.exit_code"
            return 0
          }
          export -f run_one
          export ROOT GITHUB_WORKSPACE
          seq 1 8 | xargs -n1 -P2 bash -c 'run_one "$@"' _
          python act_dr6_mcmc_20260729/campaign.py summarize --model "$MODEL" --root "$ROOT" || true
          NMIN=$(find "$ROOT/minimize" -name 'chain.minimum.txt' | wc -l)
          printf 'valid_minima=%s\n' "$NMIN" | tee "$ROOT/valid_minima.txt"
          test "$NMIN" -ge 4
      - name: Upload minimizer outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-minima-${{ matrix.model }}-gslfix-20260729
          path: campaign_${{ matrix.model }}
          retention-days: 30

  mcmc:
    needs: [gate-reuse, data-runtime, minimize]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: [M0, M1, M2, M3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GSL, MPI and Python runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py \
            'cobaya==3.6.2' 'sacc>=0.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: validated-act-cosmorec-runtime-gslfix
          path: validated
      - uses: actions/download-artifact@v4
        with:
          name: official-likelihood-packages-v3
          path: payload
      - name: Activate byte-verified likelihood payload
        run: |
          set -euxo pipefail
          (cd payload && sha256sum -c official-likelihood-packages-v3.tar.gz.sha256)
          tar -xzf payload/official-likelihood-packages-v3.tar.gz -C "$GITHUB_WORKSPACE"
          test -d "$COBAYA_PACKAGES_PATH"
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
      - name: Activate validated CAMB CosmoRec runtime
        run: |
          set -euxo pipefail
          WHEEL=$(find validated/source-runtime -type f -name 'camb-*.whl' | head -1)
          DB=$(find validated/source-runtime -type d -name Rec_database | head -1)
          DEV=$(find validated/source-runtime -type d -name Development | head -1)
          test -n "$WHEEL"
          test -n "$DB"
          test -n "$DEV"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database" "$GITHUB_WORKSPACE/Development"
          ln -s "$(realpath "$DB")" "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath "$DEV")" "$GITHUB_WORKSPACE/Development"
          mkdir -p "$GITHUB_WORKSPACE/temp"
          python -c 'import camb; print("CAMB", camb.__version__, camb.__file__)'
      - name: Install frozen ACT likelihood
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: act-minima-${{ matrix.model }}-gslfix-20260729
          path: downloaded_minima
      - name: Rebuild portable config and promote best minimum
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py write-configs \
            --model "$MODEL" --packages "$COBAYA_PACKAGES_PATH" --root "$ROOT"
          SRC=$(find downloaded_minima -type d -name minimize | head -1)
          test -n "$SRC"
          rm -rf "$ROOT/minimize"
          cp -r "$SRC" "$ROOT/minimize"
          PROV=$(find downloaded_minima -type f -name resume_provenance.json | head -1)
          if [ -n "$PROV" ]; then cp -f "$PROV" "$ROOT/"; fi
          python act_dr6_mcmc_20260729/campaign.py promote-best --model "$MODEL" --root "$ROOT"
      - name: Run four-chain MPI MCMC
        shell: bash
        run: |
          set +e
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          mkdir -p "$ROOT/logs" "$ROOT/mpi_work"
          export ROOT GITHUB_WORKSPACE
          timeout --signal=TERM 325m mpirun --oversubscribe -np 4 \
            bash -lc '
              RANK=${OMPI_COMM_WORLD_RANK:-0}
              WORK="$ROOT/mpi_work/rank_${RANK}"
              mkdir -p "$WORK/temp"
              ln -sfn "$GITHUB_WORKSPACE/Rec_database" "$WORK/Rec_database"
              ln -sfn "$GITHUB_WORKSPACE/Development" "$WORK/Development"
              cd "$WORK"
              cobaya-run "$ROOT/configs/mcmc.yaml"
            ' >"$ROOT/logs/mcmc.stdout.log" 2>"$ROOT/logs/mcmc.stderr.log"
          CODE=$?
          printf '%s\n' "$CODE" | tee "$ROOT/mcmc_exit_code.txt"
          exit 0
      - name: Summarize posterior and convergence
        if: always()
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py summarize --model "$MODEL" --root "$ROOT" || true
          python act_dr6_mcmc_20260729/analyze_chains.py --model "$MODEL" --root "$ROOT" --burn 0.30 || true
          tar -czf "ACT_DR6_${MODEL}_MCMC_GSLFIX_20260729.tar.gz" "campaign_${MODEL}"
      - name: Upload chain artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-dr6-${{ matrix.model }}-mcmc-gslfix-20260729
          path: |
            campaign_${{ matrix.model }}
            ACT_DR6_${{ matrix.model }}_MCMC_GSLFIX_20260729.tar.gz
          retention-days: 30

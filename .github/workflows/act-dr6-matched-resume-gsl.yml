name: ACT DR6 matched quartet resume with GSL

on:
  push:
    branches: [act-dr6-peer-test-20260729]
    paths:
      - '.github/workflows/act-dr6-matched-resume-gsl.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '30453797932'
  SOURCE_HEAD_SHA: 3feb2ad59ebde50a42ec83807fa381420d56730c
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  ACT_COMMIT: 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
  DATA_CACHE_KEY: act-pact-desi-dr2-planck-20260729-v3
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  gate-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source run and scientific tree
        shell: bash
        run: |
          set -euxo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source_run.json
          test "$(jq -r '.head_sha' source_run.json)" = "$SOURCE_HEAD_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" > source_jobs.json
          jq -e '[.jobs[] | select(.name == "reference" and .conclusion == "success")] | length == 1' source_jobs.json
          jq -e '[.jobs[] | select(.name == "prepare" and .conclusion == "success")] | length == 1' source_jobs.json
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git diff --exit-code "$SOURCE_HEAD_SHA" HEAD -- act_dr6_mcmc_20260729 \
            | tee scientific_diff.txt
      - name: Download validated runtime and gate artifacts
        shell: bash
        run: |
          set -euxo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name camb-1.6.6-cosmorec-wheel --dir source-runtime
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name act-dr6-matched-gates-20260729 --dir source-gates
          test -n "$(find source-runtime -type f -name 'camb-*.whl' -print -quit)"
          test -n "$(find source-runtime -type d -name Rec_database -print -quit)"
          test -n "$(find source-runtime -type d -name Development -print -quit)"
          find source-runtime -type f -print0 | sort -z | xargs -0 sha256sum \
            > reused_runtime_sha256.txt
      - name: Upload validated resume payload
        uses: actions/upload-artifact@v4
        with:
          name: validated-act-cosmorec-runtime-gslfix
          path: |
            source-runtime
            source-gates
            source_run.json
            source_jobs.json
            scientific_diff.txt
            reused_runtime_sha256.txt
          retention-days: 30

  minimize:
    needs: gate-reuse
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: [M0, M1, M2, M3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GSL, MPI and Python runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py \
            'cobaya==3.6.2' 'sacc>=0.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: validated-act-cosmorec-runtime-gslfix
          path: validated
      - name: Activate validated CAMB CosmoRec runtime
        shell: bash
        run: |
          set -euxo pipefail
          WHEEL=$(find validated/source-runtime -type f -name 'camb-*.whl' | head -1)
          DB=$(find validated/source-runtime -type d -name Rec_database | head -1)
          DEV=$(find validated/source-runtime -type d -name Development | head -1)
          test -n "$WHEEL"
          test -n "$DB"
          test -n "$DEV"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database" "$GITHUB_WORKSPACE/Development"
          ln -s "$(realpath "$DB")" "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath "$DEV")" "$GITHUB_WORKSPACE/Development"
          mkdir -p "$GITHUB_WORKSPACE/temp"
          python - <<'PY'
          import camb
          from camb import recombination
          print('CAMB', camb.__version__, camb.__file__, 'CosmoRec', type(recombination.CosmoRec()).__name__)
          PY
          ldd "$(python - <<'PY'
          import camb.baseconfig
          print(camb.baseconfig.CAMBL)
          PY
          )" | tee camb_ldd.txt
          ! grep -q 'not found' camb_ldd.txt
      - name: Install frozen ACT likelihood
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: packages
          key: ${{ env.DATA_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Remove ambiguous cached CAMB
        run: rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
      - name: Generate eight matched minimizations
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py write-configs \
            --model "$MODEL" --packages "$COBAYA_PACKAGES_PATH" --root "$ROOT"
          python - <<PY
          import json
          from pathlib import Path
          root = Path(r"$ROOT")
          (root / "resume_provenance.json").write_text(json.dumps({
              "source_run_id": int("$SOURCE_RUN_ID"),
              "source_head_sha": "$SOURCE_HEAD_SHA",
              "current_head_sha": "${{ github.sha }}",
              "runtime_fix": "installed libgsl-dev; reused validated CAMB 1.6.6+CosmoRec runtime",
              "model": "$MODEL"
          }, indent=2), encoding="utf-8")
          PY
      - name: Run eight independent starts
        shell: bash
        run: |
          set -uo pipefail
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          run_one() {
            I="$1"
            mkdir -p "$ROOT/logs"
            set +e
            cobaya-run "$ROOT/configs/minimize_${I}.yaml" \
              >"$ROOT/logs/minimize_${I}.stdout.log" \
              2>"$ROOT/logs/minimize_${I}.stderr.log"
            CODE=$?
            printf '%s\n' "$CODE" > "$ROOT/logs/minimize_${I}.exit_code"
            return 0
          }
          export -f run_one
          export ROOT
          seq 1 8 | xargs -n1 -P2 bash -c 'run_one "$@"' _
          python act_dr6_mcmc_20260729/campaign.py summarize --model "$MODEL" --root "$ROOT" || true
          NMIN=$(find "$ROOT/minimize" -name 'chain.minimum.txt' | wc -l)
          printf 'valid_minima=%s\n' "$NMIN" | tee "$ROOT/valid_minima.txt"
          test "$NMIN" -ge 4
      - name: Upload minimizer outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-minima-${{ matrix.model }}-gslfix-20260729
          path: campaign_${{ matrix.model }}
          retention-days: 30

  mcmc:
    needs: [gate-reuse, minimize]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: [M0, M1, M2, M3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GSL, MPI and Python runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev openmpi-bin libopenmpi-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py \
            'cobaya==3.6.2' 'sacc>=0.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: validated-act-cosmorec-runtime-gslfix
          path: validated
      - name: Activate validated CAMB CosmoRec runtime
        run: |
          set -euxo pipefail
          WHEEL=$(find validated/source-runtime -type f -name 'camb-*.whl' | head -1)
          DB=$(find validated/source-runtime -type d -name Rec_database | head -1)
          DEV=$(find validated/source-runtime -type d -name Development | head -1)
          test -n "$WHEEL"
          test -n "$DB"
          test -n "$DEV"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database" "$GITHUB_WORKSPACE/Development"
          ln -s "$(realpath "$DB")" "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath "$DEV")" "$GITHUB_WORKSPACE/Development"
          mkdir -p "$GITHUB_WORKSPACE/temp"
          python -c 'import camb; print("CAMB", camb.__version__, camb.__file__)'
      - name: Install frozen ACT likelihood
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout "$ACT_COMMIT"
          python -m pip install -e .
      - uses: actions/cache/restore@v4
        with:
          path: packages
          key: ${{ env.DATA_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Remove ambiguous cached CAMB
        run: rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
      - uses: actions/download-artifact@v4
        with:
          name: act-minima-${{ matrix.model }}-gslfix-20260729
          path: downloaded_minima
      - name: Rebuild portable config and promote best minimum
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py write-configs \
            --model "$MODEL" --packages "$COBAYA_PACKAGES_PATH" --root "$ROOT"
          SRC=$(find downloaded_minima -type d -name minimize | head -1)
          test -n "$SRC"
          rm -rf "$ROOT/minimize"
          cp -r "$SRC" "$ROOT/minimize"
          cp -f downloaded_minima/resume_provenance.json "$ROOT/" 2>/dev/null || true
          python act_dr6_mcmc_20260729/campaign.py promote-best --model "$MODEL" --root "$ROOT"
      - name: Run four-chain MPI MCMC
        shell: bash
        run: |
          set +e
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          mkdir -p "$ROOT/logs"
          timeout --signal=TERM 325m mpirun --oversubscribe -np 4 \
            cobaya-run "$ROOT/configs/mcmc.yaml" \
            >"$ROOT/logs/mcmc.stdout.log" 2>"$ROOT/logs/mcmc.stderr.log"
          CODE=$?
          printf '%s\n' "$CODE" | tee "$ROOT/mcmc_exit_code.txt"
          exit 0
      - name: Summarize posterior and convergence
        if: always()
        run: |
          MODEL='${{ matrix.model }}'
          ROOT="$GITHUB_WORKSPACE/campaign_${MODEL}"
          python act_dr6_mcmc_20260729/campaign.py summarize --model "$MODEL" --root "$ROOT" || true
          python act_dr6_mcmc_20260729/analyze_chains.py --model "$MODEL" --root "$ROOT" --burn 0.30 || true
          tar -czf "ACT_DR6_${MODEL}_MCMC_GSLFIX_20260729.tar.gz" "campaign_${MODEL}"
      - name: Upload chain artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-dr6-${{ matrix.model }}-mcmc-gslfix-20260729
          path: |
            campaign_${{ matrix.model }}
            ACT_DR6_${{ matrix.model }}_MCMC_GSLFIX_20260729.tar.gz
          retention-days: 30

name: PEER pipeline TDD gate

on:
  push:
    branches: [run-peer-segmented-20260911]
    paths:
      - 'pytest.ini'
      - 'peer_decisive_followups/**'
      - '.github/workflows/peer-nested-segment-launch-20260911.yml'
      - '.github/workflows/peer-nested-continuation-20260911.yml'
      - '.github/workflows/peer-nested-matched-20260910.yml'
      - '.github/workflows/act-dr6-laneb-full-planck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unit-test dependencies
        run: python -m pip install -U pytest pyyaml
      - name: Run PEER pipeline unit tests
        run: |
          python -m pytest -q \
            peer_decisive_followups/test_production_contract.py \
            peer_decisive_followups/test_checkpoint_manager.py \
            peer_decisive_followups/test_run_segment.py \
            peer_decisive_followups/test_production_config.py \
            peer_decisive_followups/test_runtime_contract.py \
            peer_decisive_followups/test_evidence.py \
            peer_decisive_followups/test_workflow_contract.py \
            peer_decisive_followups/test_metadata_relocation.py \
            peer_decisive_followups/test_polychord_bootstrap_patch.py

  polychord-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages-e2e
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PolyChord E2E runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gfortran openmpi-bin libopenmpi-dev
          python -m pip install -U pip wheel setuptools
          python -m pip install 'numpy<2.4' pyyaml pytest mpi4py 'cobaya==3.6.2'
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install polychord --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars --no-set-global
      - name: Run real PolyChord checkpoint restore resume E2E
        run: python -m pytest -q -m integration peer_decisive_followups/test_polychord_checkpoint_e2e.py

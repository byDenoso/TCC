name: PEER ACT DR6 profile

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  act-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific runtime
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "numpy<2.4" "scipy<1.18" pandas matplotlib pytest \
            "camb==1.6.6" "cobaya==3.6.2" "sacc>=0.12.0"
      - name: Install official ACT DR6 lite likelihood at frozen commit
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
          python -m pip install -e .
          git rev-parse HEAD | tee ../act_lite_commit.txt
      - name: Download official ACT DR6 payload
        run: |
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install act_dr6_cmbonly --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars
          find "$COBAYA_PACKAGES_PATH" -maxdepth 5 -type f -print | sort | tee installed_files.txt
      - name: Run official ACT likelihood gates
        run: |
          pytest -v --pyargs act_dr6_cmbonly -k 'test_import or test_install or test_model or test_TTTEEE' \
            | tee official_act_tests.log
      - name: Locate official FITS payload
        id: fits
        shell: bash
        run: |
          FITS=$(find "$COBAYA_PACKAGES_PATH" -type f -name dr6_data_cmbonly.fits | head -1)
          test -n "$FITS"
          echo "fits=$FITS" >> "$GITHUB_OUTPUT"
          sha256sum "$FITS" | tee act_payload_sha256.txt
      - name: Run PEER f-ns ACT DR6 profile
        run: |
          mkdir -p outputs
          python act_dr6_peer_20260729/run_act_profile.py \
            --fits "${{ steps.fits.outputs.fits }}" --out outputs --lmax 9000 \
            2>&1 | tee outputs/profile_run.log
          cp official_act_tests.log act_payload_sha256.txt act_lite_commit.txt installed_files.txt outputs/
      - name: Package results
        if: always()
        run: |
          tar -czf PEER_ACT_DR6_PROFILE_20260729.tar.gz outputs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peer-act-dr6-profile-20260729
          path: |
            outputs
            PEER_ACT_DR6_PROFILE_20260729.tar.gz
          retention-days: 30

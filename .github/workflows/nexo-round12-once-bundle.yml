name: NEXO Round12 Writer bundle regeneration (one-time)
on:
  push:
    branches: [fix/mega26-round12-contract-view-20261013]
    paths:
      - .github/workflows/nexo-round12-once-bundle.yml
permissions:
  contents: write
concurrency:
  group: nexo-round12-once-bundle
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mega26-round12-contract-view-20261013
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild public Writer bundle deterministically
        run: |
          set -euo pipefail
          python scripts/build_gpt_writer_bundle.py
          python -m py_compile gpt/nexo_gpt_writer.py
          git diff --check
      - name: Commit generated bytes and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "nexo-ci-bundle"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/nexo-round12-once-bundle.yml
          git add gpt/nexo_gpt_writer.py .github/workflows/nexo-round12-once-bundle.yml
          if git diff --cached --quiet; then
            echo "No bundle changes required."
            exit 0
          fi
          git commit -m "build: synchronize Writer bundle with Round12 readiness source"
          git push origin HEAD:fix/mega26-round12-contract-view-20261013

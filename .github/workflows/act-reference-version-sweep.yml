name: ACT DR6 reference version sweep

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"

jobs:
  reference-sweep:
    strategy:
      fail-fast: false
      matrix:
        camb-version: ["1.5.0", "1.5.9", "1.6.0", "1.6.6"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "numpy<2.4" "scipy<1.18" pytest \
            "camb==${{ matrix.camb-version }}" "cobaya==3.6.2" "sacc>=0.12.0"
      - name: Install frozen ACT likelihood and payload
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git act-lite
          cd act-lite
          git checkout 627aeafb88ae5ad1aa66b406bea2d65cfa66a27d
          python -m pip install -e .
          cd ..
          export COBAYA_PACKAGES_PATH="$PWD/packages"
          cobaya-install act_dr6_cmbonly --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
      - name: Evaluate official reference point
        shell: bash
        run: |
          set +e
          export COBAYA_PACKAGES_PATH="$PWD/packages"
          python -c 'import camb; print("CAMB_VERSION", camb.__version__, "PATH", camb.__file__)' | tee version.txt
          pytest -vv -s act-lite/act_dr6_cmbonly/tests/test_act.py::test_TTTEEE 2>&1 | tee reference.log
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > exit_code.txt
          grep -E 'Chisqr =|Computed log-likelihood|AssertionError|passed|failed' reference.log > extracted.txt || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: act-reference-camb-${{ matrix.camb-version }}
          path: |
            version.txt
            reference.log
            extracted.txt
            exit_code.txt
          retention-days: 30

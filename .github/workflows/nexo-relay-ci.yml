name: NEXO Relay CI

on:
  pull_request:
    paths:
      - "nexo_persist/relay.py"
      - "nexo_persist/_relay_shared.py"
      - "nexo_persist/test_relay_receipts.py"
      - "tests/test_persistence_relay.py"
      - "tests/test_persistence_relay_queue.py"
      - ".github/workflows/nexo-relay-ci.yml"
  push:
    branches:
      - "nexo/dispatch-runtime"
    paths:
      - "nexo_persist/relay.py"
      - "nexo_persist/_relay_shared.py"
      - "nexo_persist/test_relay_receipts.py"
      - "tests/test_persistence_relay.py"
      - "tests/test_persistence_relay_queue.py"
      - ".github/workflows/nexo-relay-ci.yml"

permissions:
  contents: read

jobs:
  relay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run relay receipt and transport regressions
        run: python3 -m unittest discover -s nexo_persist -p 'test_*.py' -v
      - name: Run delivery and pinned event-SHA regressions
        run: python3 -m unittest discover -s tests -p 'test_persistence_relay*.py' -v

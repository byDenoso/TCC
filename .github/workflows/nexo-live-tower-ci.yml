name: NEXO Live Tower CI

on:
  pull_request:
    paths:
      - 'runtime/nexo_agent_api/live_tower.py'
      - 'runtime/nexo_agent_api/mutations.py'
      - 'runtime/nexo_agent_api/evolution.py'
      - 'runtime/nexo_agent_api/inbox_apply.py'
      - 'runtime/nexo_agent_api/gpt_writer.py'
      - 'runtime/nexo_agent_api/public_projection.py'
      - 'gpt/nexo_memory.py'
      - 'gpt/nexo_gpt_writer.py'
      - 'runtime/nexo_agent_api/test_live_tower.py'
      - 'runtime/nexo_agent_api/test_mutations.py'
      - 'runtime/nexo_agent_api/test_incident_lifecycle.py'
      - 'runtime/nexo_agent_api/test_inbox_apply.py'
      - 'runtime/nexo_agent_api/test_public_projection.py'
      - 'runtime/nexo_agent_api/test_public_projection_writer.py'
      - 'scripts/build_public_projection.py'
      - 'scripts/nexo_tower.py'
      - '.github/workflows/nexo-live-tower-ci.yml'

permissions:
  contents: read

concurrency:
  group: nexo-live-tower-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime and projection publisher
        run: |
          python -m compileall -q runtime/nexo_agent_api
          python -m py_compile scripts/build_public_projection.py
      - name: Compile generated writer bundle
        run: python -m py_compile gpt/nexo_gpt_writer.py
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Run live Tower and incident lifecycle tests
        run: |
          python -m pytest -q \
            runtime/nexo_agent_api/test_live_tower.py \
            runtime/nexo_agent_api/test_mutations.py \
            runtime/nexo_agent_api/test_incident_lifecycle.py \
            runtime/nexo_agent_api/test_inbox_apply.py \
            runtime/nexo_agent_api/test_public_projection.py \
            runtime/nexo_agent_api/test_public_projection_writer.py

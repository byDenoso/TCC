name: Launch corrected ACT and SPT posterior campaigns

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/launch-peer-act-spt-pr.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch corrected ACT and SPT workflows
        run: |
          set -euxo pipefail
          ACT_WORKFLOW='peer-n31p-act-20chains.yml'
          SPT_WORKFLOW='peer-n31p-spt3g-20chains.yml'

          ACT_BEFORE=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$ACT_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=1" --jq '.workflow_runs[0].id // 0')
          SPT_BEFORE=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$SPT_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=1" --jq '.workflow_runs[0].id // 0')
          echo "ACT_BEFORE=$ACT_BEFORE" >> "$GITHUB_ENV"
          echo "SPT_BEFORE=$SPT_BEFORE" >> "$GITHUB_ENV"

          gh workflow run "$ACT_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run "$SPT_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main

          mkdir -p dispatched-runs
          export ACT_BEFORE SPT_BEFORE
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('dispatched-runs/pre_dispatch.json').write_text(json.dumps({
              'act_previous_run_id': int(os.environ['ACT_BEFORE']),
              'spt_previous_run_id': int(os.environ['SPT_BEFORE']),
          }, indent=2), encoding='utf-8')
          PY

      - name: Resolve exact newly dispatched run IDs
        run: |
          set -euxo pipefail
          ACT_WORKFLOW='peer-n31p-act-20chains.yml'
          SPT_WORKFLOW='peer-n31p-spt3g-20chains.yml'
          ACT_RUN=0
          SPT_RUN=0
          for ATTEMPT in $(seq 1 18); do
            ACT_RUN=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$ACT_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=1" --jq '.workflow_runs[0].id // 0')
            SPT_RUN=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$SPT_WORKFLOW/runs?event=workflow_dispatch&branch=main&per_page=1" --jq '.workflow_runs[0].id // 0')
            if [ "$ACT_RUN" -gt 0 ] && [ "$SPT_RUN" -gt 0 ] && [ "$ACT_RUN" != "$ACT_BEFORE" ] && [ "$SPT_RUN" != "$SPT_BEFORE" ]; then
              break
            fi
            sleep 5
          done
          test "$ACT_RUN" -gt 0
          test "$SPT_RUN" -gt 0
          test "$ACT_RUN" != "$ACT_BEFORE"
          test "$SPT_RUN" != "$SPT_BEFORE"
          export ACT_RUN SPT_RUN
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {
              'status': 'DISPATCHED',
              'act': {
                  'workflow': 'peer-n31p-act-20chains.yml',
                  'previous_run_id': int(os.environ['ACT_BEFORE']),
                  'run_id': int(os.environ['ACT_RUN']),
                  'gate': '20 chains, all native shard checkpoints converged, global rank Rhat-1 < 0.01',
              },
              'spt': {
                  'workflow': 'peer-n31p-spt3g-20chains.yml',
                  'previous_run_id': int(os.environ['SPT_BEFORE']),
                  'run_id': int(os.environ['SPT_RUN']),
                  'gate': '20 chains, all native shard checkpoints converged, global rank Rhat-1 < 0.01',
              },
          }
          Path('dispatched-runs/run_ids.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: corrected-act-spt-dispatched-run-ids
          path: |
            dispatched-runs/pre_dispatch.json
            dispatched-runs/run_ids.json
          retention-days: 30

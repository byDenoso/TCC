name: PEER prior-volume normalization

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Frozen campaign identifier
        required: true
        type: string
      runtime_source_run:
        description: Validated runtime artifact source run
        required: true
        default: '34561868964'
        type: string

permissions:
  contents: read
  actions: read

env:
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  normalize:
    name: prior-normalization-${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [M1, M3]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production orchestration
        uses: actions/checkout@v4

      - name: Checkout frozen science stack
        uses: actions/checkout@v4
        with:
          ref: act-dr6-peer-test-20260729
          path: science-act

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install execution dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gfortran libgsl-dev openmpi-bin libopenmpi-dev git
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'numpy<2.4' 'scipy<1.18' pandas pyyaml getdist mpi4py 'cobaya==3.6.2' 'sacc>=0.12.0'
          cobaya-install polychord --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars --no-set-global

      - name: Materialize and verify frozen runtime
        run: |
          set -euxo pipefail
          python -m peer_decisive_followups.materialize_runtime \
            --source-run '${{ inputs.runtime_source_run }}' \
            --work "$GITHUB_WORKSPACE/runtime-work" \
            --packages "$COBAYA_PACKAGES_PATH" \
            --manifest "$GITHUB_WORKSPACE/runtime_manifest.json"

      - name: Run independent prior normalization
        run: |
          set -euxo pipefail
          MODEL='${{ matrix.model }}'
          SEED=2026076101
          [ "$MODEL" = M3 ] && SEED=2026076103
          mkdir -p "$GITHUB_WORKSPACE/prior_result"
          python -m peer_decisive_followups.prior_normalization \
            --model "$MODEL" \
            --science "$GITHUB_WORKSPACE/science-act" \
            --packages "$COBAYA_PACKAGES_PATH" \
            --work "$GITHUB_WORKSPACE/prior_work_${MODEL}" \
            --runtime-manifest "$GITHUB_WORKSPACE/runtime_manifest.json" \
            --seed "$SEED" \
            --output "$GITHUB_WORKSPACE/prior_result/prior_normalization_${MODEL}.json"
          cat "$GITHUB_WORKSPACE/prior_result/prior_normalization_${MODEL}.json"

      - name: Collect compact normalization provenance
        if: always()
        run: |
          MODEL='${{ matrix.model }}'
          mkdir -p "$GITHUB_WORKSPACE/prior_result/logs"
          find "$GITHUB_WORKSPACE/prior_work_${MODEL}" -name '*.stats' -type f -exec cp {} "$GITHUB_WORKSPACE/prior_result/" \; 2>/dev/null || true
          find "$GITHUB_WORKSPACE/prior_work_${MODEL}" -name 'stdout.log' -type f -exec cp {} "$GITHUB_WORKSPACE/prior_result/logs/stdout.log" \; 2>/dev/null || true
          find "$GITHUB_WORKSPACE/prior_work_${MODEL}" -name 'stderr.log' -type f -exec cp {} "$GITHUB_WORKSPACE/prior_result/logs/stderr.log" \; 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/runtime_manifest.json" "$GITHUB_WORKSPACE/prior_result/runtime_manifest.json" 2>/dev/null || true
          find "$GITHUB_WORKSPACE/prior_work_${MODEL}" -name 'science_manifest.json' -type f -exec cp {} "$GITHUB_WORKSPACE/prior_result/science_manifest.json" \; 2>/dev/null || true

      - name: Upload normalization result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peer-prior-normalization-${{ inputs.campaign_id }}-${{ matrix.model }}
          path: prior_result
          retention-days: 30
          if-no-files-found: error

name: NEXO orchestrator contract

on:
  push:
    branches: [nexo-gh-orchestrator-20260913]
    paths:
      - '.nexo/**'
      - 'nexo_control/**'
      - 'tests/nexo/**'
      - '.github/workflows/nexo-*.yml'
  pull_request:
    paths:
      - '.nexo/**'
      - 'nexo_control/**'
      - 'tests/nexo/**'
      - '.github/workflows/nexo-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract dependencies
        run: python -m pip install -U pytest pyyaml jsonschema
      - name: Run NEXO contract suite
        run: python -m pytest -q tests/nexo

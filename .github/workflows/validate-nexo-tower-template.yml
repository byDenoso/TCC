name: Validate NEXO Tower Template

on:
  pull_request:
    paths:
      - "tower_template/**"
      - "runtime/nexo_view_api/**"
      - "runtime/nexo_agent_api/**"
      - "scripts/validate_tower_template.py"
      - "scripts/build_agent_views.py"
      - "scripts/apply_agent_mutation.py"
  push:
    branches:
      - main
    paths:
      - "tower_template/**"
      - "runtime/nexo_view_api/**"
      - "runtime/nexo_agent_api/**"
      - "scripts/validate_tower_template.py"
      - "scripts/build_agent_views.py"
      - "scripts/apply_agent_mutation.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Tower template
        run: python scripts/validate_tower_template.py tower_template
      - name: Run View API tests
        run: python -m unittest runtime.nexo_view_api.test_reader -v
      - name: Run Agent API tests
        run: >-
          python -m unittest
          runtime.nexo_agent_api.test_service
          runtime.nexo_agent_api.test_legacy_routing
          runtime.nexo_agent_api.test_mutations
          runtime.nexo_agent_api.test_state_materialization
          runtime.nexo_agent_api.test_telemetry
          -v

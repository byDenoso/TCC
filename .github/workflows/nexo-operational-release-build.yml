name: NEXO operational Writer release
on:
  push:
    branches: [nexo/operational-mcp-production]
    paths:
      - 'scripts/assemble_operational_release.py'
      - '.github/workflows/nexo-operational-release-build.yml'
permissions:
  contents: write
concurrency:
  group: nexo-operational-writer-release
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'byDenoso/TCC' && github.ref == 'refs/heads/nexo/operational-mcp-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexo/operational-mcp-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate exact PR128 source
        run: python scripts/assemble_operational_release.py
      - name: Verify existing Writer and operational conformance
        run: python -m unittest -v tests.test_writer_bundle runtime.nexo_agent_api.test_inbox_apply runtime.nexo_agent_api.test_operational_runtime
      - name: Rebuild canonical Writer bundle
        run: |
          python scripts/build_gpt_writer_bundle.py
          python -m py_compile gpt/nexo_gpt_writer.py
          sha256sum gpt/nexo_gpt_writer.py
      - uses: actions/upload-artifact@v4
        with:
          name: operational-writer-source-and-bundle
          path: |
            runtime/nexo_agent_api/operational_*.py
            runtime/nexo_agent_api/test_operational_runtime.py
            runtime/nexo_agent_api/gpt_writer.py
            runtime/nexo_agent_api/inbox_apply.py
            runtime/nexo_execution/operational_sum.py
            gpt/nexo_gpt_writer.py
          retention-days: 7
      - name: Commit tested source and deterministic bundle only
        run: |
          git add runtime/nexo_agent_api/gpt_writer.py runtime/nexo_agent_api/inbox_apply.py runtime/nexo_agent_api/operational_control.py gpt/nexo_gpt_writer.py
          git -c user.name=nexo-release-builder -c user.email=nexo-release-builder@users.noreply.github.com commit -m "feat(nexo): integrate tested operational Writer and rebuild bundle"
          git push origin HEAD:nexo/operational-mcp-production

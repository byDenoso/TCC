name: NEXO operational transport repair
on:
  push:
    branches: [nexo/operational-mcp-production]
    paths:
      - 'runtime/nexo_agent_api/operational_mcp_transport.py'
      - 'runtime/nexo_agent_api/operational_probe.py'
      - 'runtime/nexo_agent_api/operational_tick.py'
      - '.github/workflows/nexo-operational-release-build.yml'
permissions:
  contents: write
concurrency:
  group: nexo-operational-writer-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'byDenoso/TCC' && github.ref == 'refs/heads/nexo/operational-mcp-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexo/operational-mcp-production
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deployed-runtime transport repair and Writer regressions
        run: python -m unittest -v tests.test_writer_bundle runtime.nexo_agent_api.test_inbox_apply runtime.nexo_agent_api.test_operational_runtime runtime.nexo_agent_api.test_operational_mcp_transport
      - name: Build deterministic Writer bundle
        run: |
          python scripts/build_gpt_writer_bundle.py
          python -m py_compile gpt/nexo_gpt_writer.py
      - uses: actions/upload-artifact@v4
        with:
          name: operational-transport-repair
          path: |
            runtime/nexo_agent_api/operational_mcp_transport.py
            runtime/nexo_agent_api/operational_probe.py
            runtime/nexo_agent_api/operational_tick.py
            runtime/nexo_agent_api/test_operational_mcp_transport.py
            gpt/nexo_gpt_writer.py
          retention-days: 7
      - name: Commit rebuilt bundle with contents-only permission
        run: |
          git add gpt/nexo_gpt_writer.py
          git -c user.name=nexo-release-builder -c user.email=nexo-release-builder@users.noreply.github.com commit -m "build(nexo): rebuild Writer after verified MCP transport repair"
          git push origin HEAD:nexo/operational-mcp-production

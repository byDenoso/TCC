name: NEXO no-op executor
run-name: ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        required: true
        type: string
      campaign_id:
        required: true
        type: string
      test_id:
        required: true
        type: string
      should_pass:
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload deterministic executor result
        uses: actions/upload-artifact@v4
        with:
          name: nexo-executor-result-${{ inputs.correlation_id }}
          path: ${{ inputs.should_pass && '.nexo/fixtures/pass/executor-result.json' || '.nexo/fixtures/fail/executor-result.json' }}
          retention-days: 7

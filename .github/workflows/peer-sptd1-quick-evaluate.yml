name: PEER SPT D1 quick evaluate

on:
  workflow_dispatch:
  push:
    branches: [run-peer-sptd1-quick-20261001]
    paths:
      - ".github/workflows/peer-sptd1-quick-evaluate.yml"
      - "peer_n31p_spt3g_20260729/**"
      - "act_dr6_mcmc_20260729/**"

permissions:
  contents: read

concurrency:
  group: peer-sptd1-quick
  cancel-in-progress: false

env:
  CONTRACT_REF: e2dd95ba8f14caac11c931f2e25e25c48c3c4415
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/packages
  SPT_D1_REF: efe35b7bfd815a115d5123e210a6849a4175bc81
  SPT_TEMPLATE_SHA256: 67850f20e2b3f53530e7f47ef78e24f21ea20b5e69c95730409530490f1f344e
  CAMB_REF: 3ef0272d6f7ba1231128872e56e6d4c12af8267b
  FORUTILS_REF: 841f06d5356877e90437f94b2d976dd98f7f923c
  COSMOREC_SOURCE_URL: https://www.cita.utoronto.ca/~jchluba/Recombination/_Downloads_/CosmoRec.v2.0.3b.tar.gz
  COSMOREC_SHA256: 2afb82b5512f7158a0291d3a73c6520455f0e55957f2965dccc5eef82af8da1b
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen contract ancestry
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor "$CONTRACT_REF" HEAD
          git show -s --format='%H %s' "$CONTRACT_REF"

      - name: Install reproducible build runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gfortran make libgsl-dev wget
          python -m pip install 'setuptools==83.0.0' 'wheel==0.47.0' \
            'numpy==2.3.5' 'scipy==1.17.1' 'pandas==3.0.5' \
            'pyyaml==6.0.3' 'cobaya==3.6.2'

      - name: Build pinned CAMB 1.6.6 with pinned CosmoRec
        run: |
          set -euxo pipefail
          wget -q -O CosmoRec.v2.0.3b.tar.gz "$COSMOREC_SOURCE_URL"
          echo "$COSMOREC_SHA256  CosmoRec.v2.0.3b.tar.gz" | sha256sum -c -
          tar -xzf CosmoRec.v2.0.3b.tar.gz
          COSMO_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'CosmoRec*' | head -1)
          test -n "$COSMO_DIR"
          sed -i -E '/^CXXFLAGS[[:space:]]*=/ s/$/ -fPIC/' "$COSMO_DIR/Makefile.in"
          make -C "$COSMO_DIR" all -j2

          git clone --filter=blob:none --no-checkout https://github.com/cmbant/CAMB.git camb-src
          git -C camb-src fetch --depth 1 origin "$CAMB_REF"
          git -C camb-src checkout --detach "$CAMB_REF"
          git -C camb-src submodule update --init --recursive
          test "$(git -C camb-src rev-parse HEAD)" = "$CAMB_REF"
          test "$(git -C camb-src/forutils rev-parse HEAD)" = "$FORUTILS_REF"
          sed -i 's/^RECOMBINATION_FILES ?= recfast$/RECOMBINATION_FILES ?= recfast cosmorec/' \
            camb-src/fortran/Makefile_main
          sed -i "s|^COSMOREC_PATH ?=.*|COSMOREC_PATH ?=$COSMO_DIR|" \
            camb-src/fortran/Makefile_main
          (cd camb-src && python setup.py make)
          mkdir -p wheelhouse camb-runtime
          (cd camb-src && python -m pip wheel . --no-deps -w ../wheelhouse)
          cp wheelhouse/camb-*.whl camb-runtime/
          cp -a "$COSMO_DIR/Rec_database" camb-runtime/Rec_database
          cp -a "$COSMO_DIR/Development" camb-runtime/Development
          sha256sum CosmoRec.v2.0.3b.tar.gz > camb-runtime/cosmorec_source_sha256.txt
          sha256sum camb-runtime/camb-*.whl > camb-runtime/camb_cosmorec_sha256.txt
          find camb-runtime/Rec_database camb-runtime/Development -type f -print0 \
            | sort -z | xargs -0 sha256sum > camb-runtime/cosmorec_data_sha256.txt

      - name: Install frozen Planck and DESI DR2 likelihood payload
        run: |
          set -euxo pipefail
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install \
            planck_2018_lowl.TT \
            planck_2018_lowl.EE_sroll2 \
            planck_2018_lensing.native \
            bao.desi_dr2.desi_bao_all \
            --packages-path "$COBAYA_PACKAGES_PATH" --no-progress-bars
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"
          find "$COBAYA_PACKAGES_PATH" -type f \
            \( -name '*.fits' -o -name '*.dataset' -o -name '*.txt' -o -name '*.dat' \) \
            -print0 | sort -z | xargs -0 sha256sum > official_payload_sha256.txt
          find "$COBAYA_PACKAGES_PATH" -maxdepth 6 -type f -print | sort > installed_files.txt
          python -m pip freeze > prepare_pip_freeze.txt

      - name: Validate rebuilt CAMB CosmoRec runtime
        run: |
          set -euxo pipefail
          WHEEL=$(find camb-runtime -type f -name 'camb-*.whl' | head -1)
          test -n "$WHEEL"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database" "$GITHUB_WORKSPACE/Development"
          ln -s "$(realpath camb-runtime/Rec_database)" "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath camb-runtime/Development)" "$GITHUB_WORKSPACE/Development"
          mkdir -p "$GITHUB_WORKSPACE/temp"
          python - <<'PY'
          import camb
          from camb import recombination
          assert camb.__version__ == '1.6.6'
          assert type(recombination.CosmoRec()).__name__ == 'CosmoRec'
          print('CAMB/CosmoRec source rebuild identity gate: PASS')
          PY
          test -f "$GITHUB_WORKSPACE/Rec_database/Effective_Rates.HI/Effective_Rate_Tables.nS_3/res_state_list.dat"
          test -f "$GITHUB_WORKSPACE/Development/Helium/Helium.Data.lite/He4_SS.dat"
          CAMBLIB=$(python - <<'PY'
          from pathlib import Path
          import camb
          print(sorted(Path(camb.__file__).resolve().parent.glob('camblib*.so'))[0])
          PY
          )
          ldd "$CAMBLIB" | tee camb_ldd.txt
          ! grep -q 'not found' camb_ldd.txt
          grep -E 'libgsl|libgslcblas' camb_ldd.txt

      - name: Package same-run runtime and likelihood payload
        run: |
          set -euxo pipefail
          tar -czf peer-sptd1-quick-runtime-payload.tar.gz \
            camb-runtime packages official_payload_sha256.txt installed_files.txt \
            prepare_pip_freeze.txt camb_ldd.txt
          sha256sum peer-sptd1-quick-runtime-payload.tar.gz \
            > peer-sptd1-quick-runtime-payload.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: peer-sptd1-quick-runtime-${{ github.run_id }}
          path: |
            peer-sptd1-quick-runtime-payload.tar.gz
            peer-sptd1-quick-runtime-payload.tar.gz.sha256
          retention-days: 2

  evaluate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [LCDM, N31P, N31P_ALENS]
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen evaluation runtime
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libgsl-dev
          python -m pip install 'setuptools==83.0.0' 'wheel==0.47.0'
          python -m pip install \
            'numpy==2.3.5' 'scipy==1.17.1' 'pandas==3.0.5' \
            'pyyaml==6.0.3' 'cobaya==3.6.2' 'candl-like==2.0.3'

      - uses: actions/download-artifact@v4
        with:
          name: peer-sptd1-quick-runtime-${{ github.run_id }}
          path: runtime-payload

      - name: Activate frozen likelihood payload
        run: |
          set -euxo pipefail
          (cd runtime-payload && sha256sum -c peer-sptd1-quick-runtime-payload.tar.gz.sha256)
          tar -xzf runtime-payload/peer-sptd1-quick-runtime-payload.tar.gz -C "$GITHUB_WORKSPACE"
          test -d "$COBAYA_PACKAGES_PATH"
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"

      - name: Pin official SPT-3G D1 release
        run: |
          set -euxo pipefail
          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git spt-candl-data
          git -C spt-candl-data checkout "$SPT_D1_REF"
          test "$(git -C spt-candl-data rev-parse HEAD)" = "$SPT_D1_REF"
          python -m pip install --no-deps ./spt-candl-data
          python - <<'PY'
          import importlib.metadata
          import spt_candl_data
          assert importlib.metadata.version('candl-like') == '2.0.3'
          assert spt_candl_data.__version__ == '3.0.0'
          assert spt_candl_data.SPT3G_D1_TnE.endswith('SPT3G_D1_TnE_index.yaml')
          print('SPT-3G D1 package identity gate: PASS')
          PY

      - name: Activate rebuilt CAMB CosmoRec runtime
        run: |
          set -euxo pipefail
          WHEEL=$(find camb-runtime -type f -name 'camb-*.whl' | head -1)
          DB=$(find camb-runtime -type d -name Rec_database | head -1)
          DEV=$(find camb-runtime -type d -name Development | head -1)
          test -n "$WHEEL"; test -n "$DB"; test -n "$DEV"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          rm -rf "$GITHUB_WORKSPACE/Rec_database" "$GITHUB_WORKSPACE/Development"
          ln -s "$(realpath "$DB")" "$GITHUB_WORKSPACE/Rec_database"
          ln -s "$(realpath "$DEV")" "$GITHUB_WORKSPACE/Development"
          mkdir -p "$GITHUB_WORKSPACE/temp"
          CAMBLIB=$(python - <<'PY'
          from pathlib import Path
          import camb
          from camb import recombination
          assert camb.__version__ == '1.6.6'
          assert type(recombination.CosmoRec()).__name__ == 'CosmoRec'
          print(sorted(Path(camb.__file__).resolve().parent.glob('camblib*.so'))[0])
          PY
          )
          ldd "$CAMBLIB" | tee camb_ldd.txt
          ! grep -q 'not found' camb_ldd.txt
          grep -E 'libgsl|libgslcblas' camb_ldd.txt

      - name: Generate and gate the frozen D1 configuration
        run: |
          set -euxo pipefail
          python -m peer_n31p_spt3g_20260729.test_campaign
          ROOT="$GITHUB_WORKSPACE/quick_${MODEL}"
          TEMPLATE="$GITHUB_WORKSPACE/spt-candl-data/cobaya/SPT3G_D1_TnE/cobaya_ttteee.yaml"
          python -m peer_n31p_spt3g_20260729.campaign \
            --model "$MODEL" \
            --packages "$COBAYA_PACKAGES_PATH" \
            --root "$ROOT" \
            --spt-template "$TEMPLATE" \
            --spt-data-ref "$SPT_D1_REF" \
            --quick-evaluate-only
          python - <<'PY'
          import json, os, yaml
          from pathlib import Path
          model = os.environ['MODEL']
          root = Path(os.environ['GITHUB_WORKSPACE']) / f'quick_{model}'
          info = yaml.safe_load((root / 'configs/evaluate.yaml').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          likes = set(info['likelihood'])
          override = info['sampler']['evaluate']['override']
          assert info['sampler']['evaluate']['N'] == 1
          assert override and set(override) == {
              name for name, spec in info['params'].items()
              if isinstance(spec, dict) and 'prior' in spec
          }
          assert not (root / 'configs/mcmc.yaml').exists()
          assert info['likelihood']['candl_like']['data_set_file'] == 'spt_candl_data.SPT3G_D1_TnE'
          assert likes == {
              'planck_2018_lowl.TT',
              'planck_2018_lowl.EE_sroll2',
              'planck_2018_lensing.native',
              'bao.desi_dr2.desi_bao_all',
              'shoes_h0.SH0ESGaussian',
              'candl_like',
          }
          assert info['likelihood']['candl_like']['class'] == 'candl.interface.CandlCobayaLikelihood'
          assert info['likelihood']['candl_like']['clear_internal_priors'] is True
          assert manifest['spt_data_ref'] == os.environ['SPT_D1_REF']
          assert manifest['spt_template_sha256'] == os.environ['SPT_TEMPLATE_SHA256']
          assert manifest['stack'] == ('Planck low-l TT + Sroll2 EE + SPT-3G D1 TT/TE/EE + '
                                       'Planck lensing + DESI DR2 BAO + SH0ES')
          assert manifest['evaluation_reference']['interpretation'] == 'numerical_viability_probe_not_model_ranking'
          sampled_refs = [spec.get('ref') for spec in info['params'].values()
                          if isinstance(spec, dict) and 'prior' in spec]
          assert sampled_refs and all(isinstance(ref, (int, float)) for ref in sampled_refs)
          assert manifest['evaluation_reference']['values'] == override
          if model == 'LCDM':
              assert info['params']['peer_fede']['value'] == 0.0
              assert info['params']['Alens']['value'] == 1.0
          elif model == 'N31P':
              assert 'prior' in info['params']['peer_fede']
              assert info['params']['Alens']['value'] == 1.0
          else:
              assert 'prior' in info['params']['peer_fede']
              assert 'prior' in info['params']['Alens']
          print('Frozen D1 configuration identity gate: PASS')
          PY

      - name: Run one real full-likelihood evaluation
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/quick_${MODEL}"
          WORK="$GITHUB_WORKSPACE/eval_${MODEL}"
          mkdir -p "$WORK/temp"
          ln -sfn "$GITHUB_WORKSPACE/Rec_database" "$WORK/Rec_database"
          ln -sfn "$GITHUB_WORKSPACE/Development" "$WORK/Development"
          cd "$WORK"
          cobaya-run "$ROOT/configs/evaluate.yaml" \
            >"$ROOT/logs/evaluate.stdout.log" \
            2>"$ROOT/logs/evaluate.stderr.log"

      - name: Validate and attest the numerical evaluation
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/quick_${MODEL}"
          export ROOT
          python - <<'PY'
          import hashlib, importlib.metadata, json, math, os, subprocess, sys
          from pathlib import Path
          import spt_candl_data

          root = Path(os.environ['ROOT'])
          chain = root / 'evaluate/chain.1.txt'
          raw_lines = chain.read_text(encoding='utf-8').splitlines()
          lines = [line for line in raw_lines if line.strip() and not line.lstrip().startswith('#')]
          assert len(lines) == 1, f'expected one evaluate row, got {len(lines)}'
          headers = [line.lstrip()[1:].strip().split() for line in raw_lines
                     if line.lstrip().startswith('#') and 'minuslogpost' in line]
          assert headers, 'missing Cobaya chain header'
          columns = headers[-1]
          values = [float(value) for value in lines[0].split()]
          assert len(columns) == len(values)
          row = dict(zip(columns, values))
          expected_chi2 = {
              'chi2__planck_2018_lowl.TT',
              'chi2__planck_2018_lowl.EE_sroll2',
              'chi2__planck_2018_lensing.native',
              'chi2__bao.desi_dr2.desi_bao_all',
              'chi2__shoes_h0.SH0ESGaussian',
              'chi2__candl_like',
          }
          assert expected_chi2 <= set(row), expected_chi2 - set(row)
          assert all(math.isfinite(row[name]) for name in expected_chi2)
          assert all(math.isfinite(value) for value in values)

          freeze = subprocess.run(
              [sys.executable, '-m', 'pip', 'freeze'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          (root / 'evaluation_pip_freeze.txt').write_text(freeze, encoding='utf-8')

          files = [
              root / 'configs/evaluate.yaml',
              root / 'manifest.json',
              chain,
              root / 'logs/evaluate.stdout.log',
              root / 'logs/evaluate.stderr.log',
              root / 'evaluation_pip_freeze.txt',
          ]
          receipt = {
              'campaign': 'PEER SPT D1 quick full-likelihood evaluation',
              'coverage': 'evaluate_N1_only_no_MCMC_no_global_evidence',
              'nuisance_treatment': 'official_template_reference_point_no_profile_no_reoptimization',
              'interpretation': 'numerical_viability_probe_not_model_ranking',
              'model': os.environ['MODEL'],
              'contract_ref': os.environ['CONTRACT_REF'],
              'workflow_revision': os.environ['GITHUB_SHA'],
              'spt_data_ref': os.environ['SPT_D1_REF'],
              'runtime_provenance': {
                  'camb_ref': os.environ['CAMB_REF'],
                  'forutils_ref': os.environ['FORUTILS_REF'],
                  'cosmorec_source_url': os.environ['COSMOREC_SOURCE_URL'],
                  'cosmorec_sha256': os.environ['COSMOREC_SHA256'],
              },
              'software': {
                  'cobaya': importlib.metadata.version('cobaya'),
                  'candl-like': importlib.metadata.version('candl-like'),
                  'spt-candl-data': spt_candl_data.__version__,
              },
              'evaluate_rows': len(lines),
              'sha256': {
                  str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in files
              },
          }
          (root / 'quick_evaluation_receipt.json').write_text(
              json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload quick evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-sptd1-quick-${{ matrix.model }}-${{ github.run_id }}
          path: quick_${{ matrix.model }}
          if-no-files-found: error
          retention-days: 30

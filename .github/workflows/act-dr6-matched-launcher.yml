name: Launch ACT DR6 matched quartet

on:
  push:
    branches: [act-dr6-peer-test-20260729]
    paths:
      - '.github/workflows/act-dr6-matched-launcher.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/act-dr6-matched-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  launch-and-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch matched quartet for current head
        shell: bash
        run: |
          set -euo pipefail
          REF='${{ github.head_ref }}'
          if [ -z "$REF" ]; then REF='act-dr6-peer-test-20260729'; fi
          TARGET_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq '.sha')
          BEFORE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow act-dr6-matched-mcmc.yml \
            --branch "$REF" --event workflow_dispatch --limit 1 --json databaseId \
            --jq '.[0].databaseId // 0')
          gh workflow run act-dr6-matched-mcmc.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
          RUN_ID=0
          RUN_SHA=''
          for I in $(seq 1 36); do
            sleep 10
            RUN_JSON=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow act-dr6-matched-mcmc.yml \
              --branch "$REF" --event workflow_dispatch --limit 3 \
              --json databaseId,headSha,status,createdAt)
            RUN_ID=$(printf '%s' "$RUN_JSON" | jq -r --arg SHA "$TARGET_SHA" --argjson BEFORE "$BEFORE" \
              '[.[] | select(.headSha == $SHA and .databaseId != $BEFORE)][0].databaseId // 0')
            RUN_SHA=$(printf '%s' "$RUN_JSON" | jq -r --arg SHA "$TARGET_SHA" --argjson BEFORE "$BEFORE" \
              '[.[] | select(.headSha == $SHA and .databaseId != $BEFORE)][0].headSha // ""')
            if [ "$RUN_ID" != "0" ] && [ "$RUN_SHA" = "$TARGET_SHA" ]; then break; fi
          done
          test "$RUN_ID" != "0"
          test "$RUN_SHA" = "$TARGET_SHA"
          printf '%s\n' "$RUN_ID" | tee matched_run_id.txt
          printf '%s\n' "$RUN_SHA" | tee matched_head_sha.txt
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REF" --state open --limit 1 \
            --json number --jq '.[0].number // 0')
          if [ "$PR" != "0" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
              --body "ACT DR6 matched quartet launched from head \`$RUN_SHA\`. Workflow run ID: **$RUN_ID**."
          fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: act-dr6-matched-run-pointer
          path: |
            matched_run_id.txt
            matched_head_sha.txt
          if-no-files-found: warn
          retention-days: 30

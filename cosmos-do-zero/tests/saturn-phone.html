<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medição local · Saturno</title>
<style>
  html { color-scheme: dark; font: 16px system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr; min-height: 100dvh; }
  form { padding: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  input, button, a { min-height: 44px; font: inherit; }
  iframe { border: 0; width: 100%; height: 100%; min-height: 420px; }
  #status { flex-basis: 100%; }
</style>
<form>
  <label>Aparelho <input name="device" required placeholder="Modelo do celular"></label>
  <button>Medir Saturno</button>
  <a hidden download="saturno-celular.json">Baixar resultado</a>
  <output id="status"></output>
</form>
<iframe title="Aula do Sistema Solar"></iframe>
<script type="module">
  const form = document.querySelector('form');
  const frame = document.querySelector('iframe');
  const status = document.querySelector('#status');
  const result = form.querySelector('a');
  const button = form.querySelector('button');

  async function visit(trial) {
    return new Promise((resolve, reject) => {
      const limit = setTimeout(() => reject(new Error('Aula demorou a responder')), 20000);
      frame.addEventListener('load', () => {
        clearTimeout(limit);
        resolve(frame.contentWindow);
      }, { once: true });
      frame.src = `/capitulos/sistema-solar/?qa-trial=${trial}-${Date.now()}#saturno-aneis`;
    });
  }

  async function waitForStage(window) {
    const deadline = performance.now() + 15000;
    const stage = window.document.querySelector('[data-saturn-stage]');
    stage.scrollIntoView({ block: 'center' });
    while (stage.dataset.renderer !== 'playcanvas-webgl2' && performance.now() < deadline) {
      await new Promise(resolve => setTimeout(resolve, 50));
    }
    return stage;
  }

  async function sample(window, stage) {
    const clock = window.performance;
    const start = clock.now();
    const times = [];
    const input = window.document.querySelector('[data-saturn-slider]');
    const onFrame = event => times.push(event.detail.time);
    const oldValue = Number(input.value);
    stage.addEventListener('saturn:frame', onFrame);
    await new Promise(resolve => {
      const inject = () => {
        const elapsed = clock.now() - start;
        if (elapsed >= 5000) return resolve();
        input.value = String(Math.round(45 - 44 * Math.cos(elapsed / 800)));
        input.dispatchEvent(new Event('input', { bubbles: true }));
        window.requestAnimationFrame(inject);
      };
      window.requestAnimationFrame(inject);
    });
    stage.removeEventListener('saturn:frame', onFrame);
    input.value = String(oldValue);
    input.dispatchEvent(new Event('input', { bubbles: true }));
    const durationSeconds = (clock.now() - start) / 1000;
    const gaps = times.slice(1).map((time, i) => time - times[i]).sort((a, b) => a - b);
    return { durationSeconds, frames: times.length, fps: times.length / durationSeconds, p95Ms: gaps[Math.floor(.95 * (gaps.length - 1))] };
  }

  function readTiming(window) {
    const clock = window.performance;
    const navigation = clock.getEntriesByType('navigation')[0];
    const resources = clock.getEntriesByType('resource');
    const controlMs = clock.getEntriesByName('saturn:controls-ready')[0]?.startTime;
    const frameMs = clock.getEntriesByName('saturn:first-3d-frame')[0]?.startTime;
    const bytes = point => point === undefined ? undefined : navigation.transferSize +
      resources.filter(resource => resource.responseEnd <= point).reduce((total, resource) => total + resource.transferSize, 0);
    return { controlMs, frameMs, bytesThroughControl: bytes(controlMs), bytesThroughFrame: bytes(frameMs) };
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    button.disabled = true;
    result.hidden = true;
    try {
      const trials = [];
      let current;
      let stage;
      for (let trial = 1; trial <= 5; trial++) {
        status.textContent = `Abertura ${trial} de 5`;
        current = await visit(trial);
        stage = await waitForStage(current);
        trials.push(readTiming(current));
        if (!trials.at(-1).frameMs) break;
      }
      const output = {
        device: form.device.value,
        browser: navigator.userAgent,
        viewport: [current.innerWidth, current.innerHeight],
        pixelRatio: current.devicePixelRatio,
        backend: stage.dataset.renderer ?? 'diagram',
        method: 'Aberturas pela rede local e varredura programática do controle; conta renderizações da aplicação.',
        trials
      };
      if (stage.dataset.renderer === 'playcanvas-webgl2') {
        status.textContent = 'Medindo quadros · mantenha esta aba aberta';
        output.render = await sample(current, stage);
      }
      result.href = URL.createObjectURL(new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' }));
      result.hidden = false;
      status.textContent = `Medição pronta · ${output.render ? output.render.fps.toFixed(1) + ' fps' : 'diagrama ativo'}`;
    } catch (error) {
      status.textContent = String(error.message);
      button.disabled = false;
    }
  });
</script>
</html>
